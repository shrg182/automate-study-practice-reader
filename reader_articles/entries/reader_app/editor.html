<script src="../../../workspace_skin.js"></script><script id="readerArticleSeed" type="application/json">{"schema": "reader-article-v1", "id": "2a10d606-5a6c-4328-87e2-d531002c1da1", "savedAt": "2026-09-01T10:19:02.866Z", "metadata": {"type": "Article", "date": "2026-09-01", "title": "Reader App", "byline": "Building an application for reading books"}, "bodyHTML": "<p>[https://chatgpt.com/share/6a96a4bc-975c-83e9-88f2-5ff6cbde7302](https://chatgpt.com/share/6a96a4bc-975c-83e9-88f2-5ff6cbde7302)<\/p><p><br><\/p><p>Please consider if the scheme described in the conversation would be good for your reference in building this reader\\_app.<\/p><p><br><\/p><p>Yes—the shared conversation is a good product and roadmap reference for <code dir=\"ltr\">reader_app<\/code>, but I would refine its technical structure before implementation. The strongest ideas are the staged delivery and the separation of each user’s library, progress, annotations, and vocabulary. <a href=\"https://chatgpt.com/share/6a96a4bc-975c-83e9-88f2-5ff6cbde7302\">Shared conversation<\/a><\/p><p>I recommend adopting:<\/p><ul><li>Flask, SQLite, SQLAlchemy, Flask-Login, and Werkzeug password hashing.<\/li><li>TXT and Markdown support first; EPUB and PDF later.<\/li><li>Library → reader → progress → annotations → vocabulary sequencing.<\/li><li>English, Chinese, and Russian as first-class text/language requirements.<\/li><li>Strict ownership checks so users can access only their own records and files.<\/li><li>Browser-based, responsive two-pane reading UI.<\/li><\/ul><p>I would change the proposed scaffold in several ways:<\/p><ul><li>Keep the existing <code dir=\"ltr\">src/reader_app/<\/code> package layout instead of placing <code dir=\"ltr\">app.py<\/code>, <code dir=\"ltr\">models/<\/code>, and <code dir=\"ltr\">routes/<\/code> at the repository root.<\/li><li>Use an application factory rather than one large global Flask application.<\/li><li>Group routes into Flask blueprints: <code dir=\"ltr\">auth<\/code>, <code dir=\"ltr\">library<\/code>, <code dir=\"ltr\">reader<\/code>, <code dir=\"ltr\">notes<\/code>, and <code dir=\"ltr\">vocabulary<\/code>.<\/li><li>Put runtime data in Flask’s instance directory, excluded from source control.<\/li><li>Use one database initially, not separate library and vocabulary databases.<\/li><li>Add database migrations early rather than creating tables implicitly forever.<\/li><li>Represent reading locations with format-aware locators, not merely a percentage or raw scroll position.<\/li><li>Store immutable source files separately from parsed reading content.<\/li><li>Sanitize rendered Markdown and validate uploads by content, filename, and size.<\/li><li>Keep annotation anchors independent from display layout so font-size changes do not invalidate highlights.<\/li><\/ul><p>A suitable target structure would be:<\/p><pre dir=\"ltr\"><code>reader_app/\n├── pyproject.toml\n├── README.md\n├── src/reader_app/\n│   ├── __init__.py\n│   ├── app.py\n│   ├── extensions.py\n│   ├── models/\n│   ├── auth/\n│   ├── library/\n│   ├── reader/\n│   ├── annotations/\n│   ├── vocabulary/\n│   ├── templates/\n│   └── static/\n├── instance/\n│   ├── reader.sqlite3\n│   └── books/\n├── migrations/\n└── tests/<\/code><\/pre><p>One product decision matters: if this will remain a private, single-user application on your Mac, registration and login are unnecessary overhead. If it may be hosted, accessed from multiple devices, or used by multiple people, authentication and per-user ownership should be foundational.<\/p><p>My recommended first milestone is therefore:<\/p><ol start=\"1\"><li>Application factory and configuration.<\/li><li>User registration/login if multi-user operation is intended.<\/li><li>Library and safe TXT/Markdown import.<\/li><li>Comfortable multilingual reading view.<\/li><li>Durable progress saving.<\/li><li>Tests for authentication, ownership boundaries, uploads, and Unicode text.<\/li><\/ol><p>The conversation’s scheme is now useful context for this project, particularly its feature scope and staged roadmap; I would use the refined architecture above as the actual implementation blueprint.<\/p>", "footnotes": [], "notes": "", "splitPercent": 50}</script><script src="../../workspace.js"></script></body></html>
