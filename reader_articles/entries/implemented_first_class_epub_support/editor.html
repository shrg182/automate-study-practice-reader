<script src="../../../workspace_skin.js"></script><script id="readerArticleSeed" type="application/json">{"schema": "reader-article-v1", "id": "bc0c7e7e-4955-4ac7-8ee0-c7981e4aeae1", "savedAt": "2026-09-01T11:24:44.406Z", "metadata": {"type": "Article", "date": "2026-09-01", "title": "Implemented first-class EPUB support.", "byline": "continue with reader app milestone backup"}, "bodyHTML": "<h2>Introduction<\/h2><p>Implemented first-class EPUB support.<\/p><p>New capabilities:<\/p><ul><li>EPUB ZIP and media-type validation<\/li><li>Archive traversal, XML entity, expansion-limit, encryption, and DRM rejection<\/li><li>Metadata extraction:<ul><li>Title<\/li><li>Author<\/li><li>Language<\/li><li>Identifier<\/li><\/ul><\/li><li>EPUB navigation-document and spine parsing<\/li><li>Sanitized XHTML chapter storage<\/li><li>Protected PNG, JPEG, GIF, and WebP assets<\/li><li>Previous/next chapter navigation<\/li><li>EPUB table of contents<\/li><li>Responsive images<\/li><li>Chapter-plus-position progress<\/li><li>Chapter-scoped highlights, notes, and vocabulary<\/li><li>Dashboard source links that reopen the correct chapter<\/li><li>EPUB content included in personal backups<\/li><\/ul><p>Key files:<\/p><ul><li><span data-prompt-link-label=\"EPUB parser\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/epub.py\">[EPUB parser](/Users/ruixingshi/Python/reader_app/src/reader_app/epub.py)<\/span><\/li><li><span data-prompt-link-label=\"EPUB import handling\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/library.py\">[EPUB import handling](/Users/ruixingshi/Python/reader_app/src/reader_app/library.py)<\/span><\/li><li><span data-prompt-link-label=\"Chapter-aware reader\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/reader.py\">[Chapter-aware reader](/Users/ruixingshi/Python/reader_app/src/reader_app/reader.py)<\/span><\/li><li><span data-prompt-link-label=\"EPUB schema migration\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/migrations/versions/c76f56bbd44a_add_epub_chapters_and_anchors.py\">[EPUB schema migration](/Users/ruixingshi/Python/reader_app/migrations/versions/c76f56bbd44a_add_epub_chapters_and_anchors.py)<\/span><\/li><\/ul><p>Verification:<\/p><pre dir=\"ltr\"><code>18 tests passed\nRuff: All checks passed\nJavaScript syntax: valid\nClean database migration: passed\nExisting database migration: passed\nCurrent schema: c76f56bbd44a<\/code><\/pre><p>The migration initially encountered an Alembic SQLite constraint-naming issue. It was repaired and rerun successfully. Only the empty partial migration table was removed; no user records were affected.<\/p><p><br><\/p><p><br><\/p><p>Next should be backup restoration and EPUB refinements before beginning PDF.<\/p><p>Recommended milestone:<\/p><ol start=\"1\"><li><p>Personal backup restoration<\/p><ul><li>Upload a Reader backup ZIP<\/li><li>Validate its manifest and SQLite schema<\/li><li>Preview books, notes, vocabulary, and conflicts<\/li><li>Restore into the current account only<\/li><li>Reassign IDs safely<\/li><li>Detect duplicate books by hash<\/li><li>Roll back completely if restoration fails<\/li><li>Never restore password hashes or another user’s identity<\/li><\/ul><\/li><li><p>EPUB refinements<\/p><ul><li>Extract and display cover images<\/li><li>Preserve safe inline formatting more faithfully<\/li><li>Improve footnotes and internal links<\/li><li>Show book-level and chapter-level progress<\/li><li>Remember the last-opened chapter<\/li><li>Handle EPUB 2 NCX navigation as well as EPUB 3 navigation documents<\/li><\/ul><\/li><li><p>Book organization<\/p><ul><li>Collections or shelves<\/li><li>Favorites<\/li><li>Tags<\/li><li>Library filtering by format, language, and reading status<\/li><\/ul><\/li><li><p>Study improvements<\/p><ul><li>Export vocabulary in Anki-compatible TSV<\/li><li>Mark vocabulary as learning, reviewing, or mastered<\/li><li>Add review dates<\/li><li>Navigate directly between highlights inside a chapter<\/li><\/ul><\/li><li><p>Operational hardening<\/p><ul><li>Production configuration validation<\/li><li>Structured error pages<\/li><li>Logging<\/li><li>Upload-rate limits<\/li><li>Recovery tests for interrupted imports and restores<\/li><\/ul><\/li><\/ol><p>I recommend implementing safe backup restoration first. It completes the data portability story and provides an important recovery mechanism before PDF work introduces more complex stored assets and anchors.<\/p><p><br><\/p><p>Implemented safe personal-backup restoration.<\/p><p>New restoration workflow:<\/p><ol start=\"1\"><li>Upload a Reader backup ZIP.<\/li><li>Validate its archive, manifest, SQLite integrity, and schema.<\/li><li>Preview books, annotations, vocabulary, and duplicate conflicts.<\/li><li>Explicitly confirm restoration.<\/li><li>Restore everything into the current account with newly assigned IDs.<\/li><\/ol><p>Safety guarantees:<\/p><ul><li>Archive traversal and expansion limits<\/li><li>100 MB upload limit<\/li><li>Read-only inspection of the backup database<\/li><li>Content-hash verification<\/li><li>Duplicate books skipped<\/li><li>Passwords and original account identity never restored<\/li><li>EPUB chapters and assets regenerated safely<\/li><li>Transactional database restoration<\/li><li>Newly created files removed if restoration fails<\/li><li>Abandoned uploads removed after 24 hours<\/li><li>Restore tokens bound to the current session and account<\/li><li>Existing reader preferences preserved<\/li><\/ul><p>Key files:<\/p><ul><li><span data-prompt-link-label=\"Restoration engine\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/restore.py\">[Restoration engine](/Users/ruixingshi/Python/reader_app/src/reader_app/restore.py)<\/span><\/li><li><span data-prompt-link-label=\"Backup upload interface\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/templates/restore/upload.html\">[Backup upload interface](/Users/ruixingshi/Python/reader_app/src/reader_app/templates/restore/upload.html)<\/span><\/li><li><span data-prompt-link-label=\"Restore preview\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/templates/restore/preview.html\">[Restore preview](/Users/ruixingshi/Python/reader_app/src/reader_app/templates/restore/preview.html)<\/span><\/li><\/ul><p>Verification:<\/p><pre dir=\"ltr\"><code>22 tests passed\nRuff: All checks passed\nJavaScript syntax: valid\nCLI verification: passed<\/code><\/pre><p>The header now includes a <strong>Restore<\/strong> link next to <strong>Backup<\/strong>.<\/p>", "footnotes": [], "notes": "", "splitPercent": 50}</script><script src="../../workspace.js"></script></body></html>
