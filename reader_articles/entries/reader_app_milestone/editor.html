<script src="../../../workspace_skin.js"></script><script id="readerArticleSeed" type="application/json">{"schema": "reader-article-v1", "id": "3314c7c8-4413-4c91-b5a1-c3f3db655261", "savedAt": "2026-09-01T11:08:16.010Z", "metadata": {"type": "Article", "date": "2026-09-01", "title": "Reader App milestone", "byline": "Implemented the first usable Reader App milestone."}, "bodyHTML": "<h2>Introduction<\/h2><p>Implemented the first usable Reader App milestone.<\/p><p>It now includes:<\/p><ul><li>Account registration, login, logout, and CSRF protection<\/li><li>Isolated personal libraries with ownership enforcement<\/li><li>TXT and Markdown imports up to 10 MB<\/li><li>English, Chinese, Russian, and general Unicode support<\/li><li>Sanitized Markdown rendering<\/li><li>Responsive reading interface<\/li><li>Automatic reading-position saving and restoration<\/li><li>Library title search<\/li><li>SQLite persistence<\/li><li>Six functional tests covering authentication, ownership, imports, Unicode, Markdown safety, and progress<\/li><\/ul><p>Key files:<\/p><ul><li><span data-prompt-link-label=\"Application factory\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/__init__.py\">[Application factory](/Users/ruixingshi/Python/reader_app/src/reader_app/__init__.py)<\/span><\/li><li><span data-prompt-link-label=\"Database models\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/models.py\">[Database models](/Users/ruixingshi/Python/reader_app/src/reader_app/models.py)<\/span><\/li><li><span data-prompt-link-label=\"Reader routes\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/reader.py\">[Reader routes](/Users/ruixingshi/Python/reader_app/src/reader_app/reader.py)<\/span><\/li><li><span data-prompt-link-label=\"Reader interface\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/templates/reader/read.html\">[Reader interface](/Users/ruixingshi/Python/reader_app/src/reader_app/templates/reader/read.html)<\/span><\/li><li><span data-prompt-link-label=\"Project instructions\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/README.md\">[Project instructions](/Users/ruixingshi/Python/reader_app/README.md)<\/span><\/li><\/ul><p>Verification:<\/p><pre dir=\"ltr\"><code>6 passed\nRuff: All checks passed\nReader App 0.1.0<\/code><\/pre><p>Run it with:<\/p><pre dir=\"ltr\"><code>source .venv/bin/activate\nreader-app<\/code><\/pre><p>Then open <a href=\"http://127.0.0.1:5000/\">http://127.0.0.1:5000<\/a>. Runtime books and the database will be created under the ignored <code dir=\"ltr\">instance/<\/code> directory.<\/p><p><br><\/p><p>The next milestone should make the reader useful for active study: annotations, highlights, and vocabulary.<\/p><p>Recommended order:<\/p><ol start=\"1\"><li><p>Stable text anchoring<br>Give each paragraph and text segment a durable identifier so highlights survive reopening, resizing, and font changes.<\/p><\/li><li><p>Highlights and notes<br>Select text, choose a highlight color, attach a note, edit/delete annotations, and show them again inside the book.<\/p><\/li><li><p>Vocabulary collection<br>Select a word or phrase and save it with language, definition, context sentence, source book, and optional personal note.<\/p><\/li><li><p>Notes and vocabulary dashboards<br>Search/filter saved items by book, language, date, or keyword; jump from an item back to its original passage.<\/p><\/li><li><p>Reader controls<br>Font family, font size, line spacing, reading width, light/sepia/dark themes, and a collapsible sidebar.<\/p><\/li><li><p>Import improvements<br>Chapter detection for TXT/Markdown, duplicate-file detection, metadata editing, and safe book deletion.<\/p><\/li><\/ol><p>After those foundations are stable:<\/p><ul><li>EPUB support<\/li><li>PDF support<\/li><li>Dictionaries and multilingual lookup<\/li><li>Export/backup<\/li><li>Database migrations and production deployment<\/li><\/ul><p>The immediate implementation target I recommend is: durable text anchors plus complete highlight/note support, including ownership tests and restoration after reopening a book.<\/p><p><br><\/p><p>Implemented the highlights and notes milestone.<\/p><p>New capabilities:<\/p><ul><li>Select book text to create a durable highlight<\/li><li>Four highlight colors<\/li><li>Optional notes attached to selections<\/li><li>Automatic restoration after reopening<\/li><li>Edit highlight color and note<\/li><li>Delete annotations<\/li><li>Responsive annotation sidebar<\/li><li>Ownership enforcement for every annotation operation<\/li><li>Offset and length validation<\/li><\/ul><p>Key files:<\/p><ul><li><span data-prompt-link-label=\"Annotation API\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/annotations.py\">[Annotation API](/Users/ruixingshi/Python/reader_app/src/reader_app/annotations.py)<\/span><\/li><li><span data-prompt-link-label=\"Annotation model\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/models.py\">[Annotation model](/Users/ruixingshi/Python/reader_app/src/reader_app/models.py)<\/span><\/li><li><span data-prompt-link-label=\"Reader interaction\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/static/reader.js\">[Reader interaction](/Users/ruixingshi/Python/reader_app/src/reader_app/static/reader.js)<\/span><\/li><li><span data-prompt-link-label=\"Reader interface\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/templates/reader/read.html\">[Reader interface](/Users/ruixingshi/Python/reader_app/src/reader_app/templates/reader/read.html)<\/span><\/li><\/ul><p>Verification:<\/p><pre dir=\"ltr\"><code>8 tests passed\nRuff: All checks passed\nJavaScript syntax: valid<\/code><\/pre><p>Restart <code dir=\"ltr\">reader-app<\/code>, open a book, and select some text. The annotation editor will appear beside the reading surface.<\/p><p>The next milestone is a searchable vocabulary collection and an all-books notes dashboard.<\/p><p><br><\/p><p>Next should be the vocabulary and notes workspace.<\/p><p>Recommended scope:<\/p><ol start=\"1\"><li><p>Vocabulary capture<br>Select a word or phrase while reading and save:<\/p><ul><li>Word or phrase<\/li><li>Language<\/li><li>Definition<\/li><li>Context sentence<\/li><li>Personal note<\/li><li>Source book and text location<\/li><\/ul><\/li><li><p>Vocabulary dashboard<br>Add a dedicated page where users can:<\/p><ul><li>Search saved terms<\/li><li>Filter by book and language<\/li><li>Edit definitions and notes<\/li><li>Delete entries<\/li><li>Jump back to the source passage<\/li><\/ul><\/li><li><p>All-books notes dashboard<br>Collect annotations from every book in one searchable view, with filters for book, color, and keyword.<\/p><\/li><li><p>Reader navigation<br>Clicking a vocabulary item or note should open its book and scroll to the anchored passage.<\/p><\/li><li><p>Export<br>Export vocabulary and notes as CSV or Markdown for study and backup.<\/p><\/li><\/ol><p>After that, I recommend reader appearance settings, chapter detection, and duplicate-book handling before beginning EPUB support.<\/p><p><br><\/p><p>Implemented the vocabulary and notes workspace.<\/p><p>New capabilities:<\/p><ul><li>Save selected words or phrases from the reader<\/li><li>Record language, definition, context, and personal notes<\/li><li>Search vocabulary across all books<\/li><li>Filter vocabulary by book and language<\/li><li>Edit and delete vocabulary entries<\/li><li>Search all highlights and notes<\/li><li>Filter annotations by book and highlight color<\/li><li>Open the source book directly at a saved passage<\/li><li>Ownership protection across every study record<\/li><\/ul><p>Key files:<\/p><ul><li><span data-prompt-link-label=\"Study routes and APIs\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/study.py\">[Study routes and APIs](/Users/ruixingshi/Python/reader_app/src/reader_app/study.py)<\/span><\/li><li><span data-prompt-link-label=\"Vocabulary model\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/models.py\">[Vocabulary model](/Users/ruixingshi/Python/reader_app/src/reader_app/models.py)<\/span><\/li><li><span data-prompt-link-label=\"Vocabulary dashboard\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/templates/study/vocabulary.html\">[Vocabulary dashboard](/Users/ruixingshi/Python/reader_app/src/reader_app/templates/study/vocabulary.html)<\/span><\/li><li><span data-prompt-link-label=\"Notes dashboard\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/templates/study/notes.html\">[Notes dashboard](/Users/ruixingshi/Python/reader_app/src/reader_app/templates/study/notes.html)<\/span><\/li><li><span data-prompt-link-label=\"Reader selection behavior\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/static/reader.js\">[Reader selection behavior](/Users/ruixingshi/Python/reader_app/src/reader_app/static/reader.js)<\/span><\/li><\/ul><p>Verification:<\/p><pre dir=\"ltr\"><code>10 tests passed\nRuff: All checks passed\nJavaScript syntax: valid<\/code><\/pre><p>Restart <code dir=\"ltr\">reader-app<\/code>. The header now contains <strong>Vocabulary<\/strong> and <strong>Notes<\/strong> links. Select text inside a book to save it either as a highlight or a vocabulary entry.<\/p><p><br><\/p><p>Next should be reader usability and book-management improvements before adding complex file formats.<\/p><p>Recommended milestone:<\/p><ol start=\"1\"><li><p>Reader appearance controls<\/p><ul><li>Font family and size<\/li><li>Line spacing<\/li><li>Reading-column width<\/li><li>Light, sepia, and dark themes<\/li><li>Persist settings per user<\/li><\/ul><\/li><li><p>Chapter navigation<\/p><ul><li>Detect Markdown headings<\/li><li>Detect likely chapter headings in TXT books<\/li><li>Generate a table of contents<\/li><li>Jump between chapters<\/li><li>Save progress using chapter plus text offset<\/li><\/ul><\/li><li><p>Library management<\/p><ul><li>Edit title, author, and language<\/li><li>Detect duplicate uploads using file hashes<\/li><li>Delete books and their associated files safely<\/li><li>Display reading percentages and annotation/vocabulary counts<\/li><\/ul><\/li><li><p>Backup and export<\/p><ul><li>Export vocabulary as CSV<\/li><li>Export notes as Markdown<\/li><li>Create a downloadable personal-data backup<\/li><\/ul><\/li><li><p>Database migrations<\/p><ul><li>Add Alembic/Flask-Migrate before the schema grows further<\/li><li>Replace automatic <code dir=\"ltr\">create_all()<\/code> as the long-term upgrade strategy<\/li><\/ul><\/li><\/ol><p>I recommend implementing database migrations first, followed by appearance controls and chapter navigation. That prepares the project safely for EPUB support afterward.<\/p><p><br><\/p><p>Implemented the migration, appearance, and chapter-navigation milestone.<\/p><p>New capabilities:<\/p><ul><li>Versioned Alembic database migrations<\/li><li>Automatic migration when <code dir=\"ltr\">reader-app<\/code> starts<\/li><li>Safe adoption of existing pre-migration databases<\/li><li>Per-user reader preferences:<ul><li>Light, sepia, and dark themes<\/li><li>Serif or sans-serif type<\/li><li>Font size<\/li><li>Line spacing<\/li><li>Reading-column width<\/li><\/ul><\/li><li>Automatic Markdown heading navigation<\/li><li>TXT chapter detection for English, Chinese, and Russian headings<\/li><li>Collapsible table of contents in the reader<\/li><\/ul><p>Key files:<\/p><ul><li><span data-prompt-link-label=\"Migration setup\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/migrations/env.py\">[Migration setup](/Users/ruixingshi/Python/reader_app/migrations/env.py)<\/span><\/li><li><span data-prompt-link-label=\"Baseline migration\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/migrations/versions/0001_initial.py\">[Baseline migration](/Users/ruixingshi/Python/reader_app/migrations/versions/0001_initial.py)<\/span><\/li><li><span data-prompt-link-label=\"Reader preferences and chapter processing\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/reader.py\">[Reader preferences and chapter processing](/Users/ruixingshi/Python/reader_app/src/reader_app/reader.py)<\/span><\/li><li><span data-prompt-link-label=\"Reader controls\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/templates/reader/read.html\">[Reader controls](/Users/ruixingshi/Python/reader_app/src/reader_app/templates/reader/read.html)<\/span><\/li><li><span data-prompt-link-label=\"Startup migration handling\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/cli.py\">[Startup migration handling](/Users/ruixingshi/Python/reader_app/src/reader_app/cli.py)<\/span><\/li><\/ul><p>Verification:<\/p><pre dir=\"ltr\"><code>12 tests passed\nRuff: All checks passed\nJavaScript syntax: valid\nClean database migration: passed\nExisting database migration: passed<\/code><\/pre><p>The existing local database has already been safely upgraded to migration <code dir=\"ltr\">4034ef243f18<\/code>. Restart <code dir=\"ltr\">reader-app<\/code> to use the new controls.<\/p><p><br><\/p><p><br><\/p><p>Next should be library management, backup, and export before introducing EPUB.<\/p><p>Recommended milestone:<\/p><ol start=\"1\"><li><p>Book management<\/p><ul><li>Edit title, author, and language<\/li><li>Delete a book and its stored file<\/li><li>Show reading percentage<\/li><li>Show highlight, note, and vocabulary counts<\/li><li>Add sorting by title, author, recent activity, and progress<\/li><\/ul><\/li><li><p>Duplicate detection<\/p><ul><li>Calculate a SHA-256 hash during import<\/li><li>Warn when the same file already exists<\/li><li>Prevent duplicate storage while allowing an intentional second library entry<\/li><\/ul><\/li><li><p>Data export<\/p><ul><li>Export vocabulary as CSV<\/li><li>Export notes and highlights as Markdown<\/li><li>Export a single book’s study material<\/li><li>Preserve multilingual text correctly<\/li><\/ul><\/li><li><p>Personal backup<\/p><ul><li>Download a ZIP containing the database, uploaded books, and a manifest<\/li><li>Provide clear restoration instructions<\/li><li>Ensure one user’s export never includes another user’s data<\/li><\/ul><\/li><li><p>Library safety<\/p><ul><li>Confirmation before deletion<\/li><li>Transactional database cleanup<\/li><li>Remove the stored file only after confirming no remaining record uses it<\/li><li>Tests for ownership and failure recovery<\/li><\/ul><\/li><\/ol><p>After that foundation is complete, EPUB is the right next format. PDF should follow EPUB because reliable PDF reading, selection, and annotation anchoring is substantially more complex.<\/p><p><br><\/p><p><br><\/p><p>Implemented the library management, export, and backup milestone.<\/p><p>New library capabilities:<\/p><ul><li>Edit title, author, and language<\/li><li>Display reading progress, highlight count, and vocabulary count<\/li><li>Sort by recent activity, title, author, or progress<\/li><li>Detect duplicate uploads using SHA-256<\/li><li>Warn before importing duplicate content<\/li><li>Permanently delete books with confirmation<\/li><li>Cascade deletion through progress, annotations, and vocabulary<\/li><li>Remove stored files only after database cleanup succeeds<\/li><\/ul><p>New export capabilities:<\/p><ul><li>Vocabulary CSV with multilingual UTF-8 support<\/li><li>All-notes Markdown export<\/li><li>Per-book study-material export<\/li><li>Personal ZIP backup containing:<ul><li>Only the current user’s books<\/li><li>A portable user-specific SQLite database<\/li><li>Study notes in Markdown<\/li><li>Backup manifest<\/li><\/ul><\/li><li>Password hashes and other users’ information are excluded<\/li><\/ul><p>Key files:<\/p><ul><li><span data-prompt-link-label=\"Library management\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/library.py\">[Library management](/Users/ruixingshi/Python/reader_app/src/reader_app/library.py)<\/span><\/li><li><span data-prompt-link-label=\"Export and backup system\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/exports.py\">[Export and backup system](/Users/ruixingshi/Python/reader_app/src/reader_app/exports.py)<\/span><\/li><li><span data-prompt-link-label=\"Book management interface\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/src/reader_app/templates/library/edit.html\">[Book management interface](/Users/ruixingshi/Python/reader_app/src/reader_app/templates/library/edit.html)<\/span><\/li><li><span data-prompt-link-label=\"Content-hash migration\" data-prompt-link-href=\"/Users/ruixingshi/Python/reader_app/migrations/versions/6e7c77304567_add_book_content_hashes.py\">[Content-hash migration](/Users/ruixingshi/Python/reader_app/migrations/versions/6e7c77304567_add_book_content_hashes.py)<\/span><\/li><\/ul><p>Verification:<\/p><pre dir=\"ltr\"><code>15 tests passed\nRuff: All checks passed\nJavaScript syntax: valid\nClean migration: passed\nExisting database migration: passed\nCurrent schema: 6e7c77304567<\/code><\/pre><p>The local database has already been upgraded, and hashes are backfilled automatically for older books. The next major milestone is EPUB support.<\/p><p><br><\/p><p>Next is EPUB support, which should be implemented as a chapter-aware reading format rather than flattened into one large text file.<\/p><p>Recommended milestone:<\/p><ol start=\"1\"><li><p>Safe EPUB import<\/p><ul><li>Validate the ZIP structure and required EPUB files<\/li><li>Reject encrypted, malformed, or oversized archives<\/li><li>Extract metadata: title, author, language, identifier, and cover<\/li><li>Continue using SHA-256 duplicate detection<\/li><li>Prevent archive path traversal<\/li><\/ul><\/li><li><p>EPUB processing<\/p><ul><li>Parse the package manifest and reading order<\/li><li>Sanitize chapter XHTML<\/li><li>Rewrite internal chapter links<\/li><li>Extract images and styles safely<\/li><li>Store a normalized chapter representation<\/li><\/ul><\/li><li><p>Chapter-based reader<\/p><ul><li>Navigate between chapters<\/li><li>Generate the table of contents from EPUB navigation metadata<\/li><li>Remember chapter plus within-chapter position<\/li><li>Support responsive images and footnotes<\/li><li>Preserve appearance controls<\/li><\/ul><\/li><li><p>EPUB annotations<\/p><ul><li>Store anchors as chapter identifier plus character offsets<\/li><li>Restore highlights and vocabulary within the correct chapter<\/li><li>Make dashboard source links open the correct chapter<\/li><\/ul><\/li><li><p>Migration and compatibility<\/p><ul><li>Add format-specific location fields without breaking TXT/Markdown records<\/li><li>Keep current progress and annotations working unchanged<\/li><li>Add malformed-file, ownership, Unicode, navigation, and anchoring tests<\/li><\/ul><\/li><\/ol><p>After EPUB is stable, the next steps should be restoration from personal backups, then PDF support.<\/p><p><br><\/p>", "footnotes": [], "notes": "", "splitPercent": 50}</script><script src="../../workspace.js"></script></body></html>
