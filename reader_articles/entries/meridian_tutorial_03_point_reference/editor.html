<script src="../../../workspace_skin.js"></script><script id="readerArticleSeed" type="application/json">{"schema": "reader-article-v1", "id": "237a81ef-1a57-515e-a9de-4a56d9fe11b8", "savedAt": "2026-09-20T12:00:00+08:00", "metadata": {"type": "Reading material", "date": "2026-09-20", "title": "经络阅读教程（三）：十四经穴名称检索表", "byline": "Reader tutorial · assembled from user-provided material"}, "bodyHTML": "<nav class=\"series-navigation\" aria-label=\"教程导航\"><a href=\"../meridian_tutorial_02_extraordinary_vessels/editor.html\">← 上一篇：经络阅读教程（二）：奇经八脉与八脉交会穴<\/a><a href=\"../../../index.html#reader_articles\">返回 Reader Articles<\/a><\/nav>\n<p><strong>使用方法：<\/strong>本篇是配合前两篇使用的名称索引。先确认经脉分类和走向，再按“首穴 → 末穴”的顺序阅读。穴名表不包含定位、针刺深度、禁忌或治疗建议。<\/p>\n<p class=\"callout\"><strong>安全说明：<\/strong>请勿仅凭名称表自行针刺。错误定位、深度或方向可能造成感染、出血、气胸或其他严重损伤。<\/p>\n<h2>一、数量框架<\/h2>\n<p>十二正经左右对称，共309对（618个双侧穴位）；任脉24穴、督脉28穴位于正中线，为52个单穴。按标准穴名计数，十二正经与任督二脉合计<strong>361个十四经穴<\/strong>。<\/p>\n<h2>二、十二正经<\/h2>\n<table class=\"point-table\"><thead><tr><th>经脉<\/th><th>穴数<\/th><th>穴位（首穴 → 末穴）<\/th><\/tr><\/thead><tbody><tr><th>手太阴肺经<\/th><td>11<\/td><td>中府、云门、天府、侠白、尺泽、孔最、列缺、经渠、太渊、鱼际、少商<\/td><\/tr><tr><th>手厥阴心包经<\/th><td>9<\/td><td>天池、天泉、曲泽、郄门、间使、内关、大陵、劳宫、中冲<\/td><\/tr><tr><th>手少阴心经<\/th><td>9<\/td><td>极泉、青灵、少海、灵道、通里、阴郄、神门、少府、少冲<\/td><\/tr><tr><th>手阳明大肠经<\/th><td>20<\/td><td>商阳、二间、三间、合谷、阳溪、偏历、温溜、下廉、上廉、手三里、曲池、肘髎、手五里、臂臑、肩髃、巨骨、天鼎、扶突、口禾髎、迎香<\/td><\/tr><tr><th>手少阳三焦经<\/th><td>23<\/td><td>关冲、液门、中渚、阳池、外关、支沟、会宗、三阳络、四渎、天井、清冷渊、消泺、臑会、肩髎、天髎、天牖、翳风、瘈脉、颅息、角孙、耳门、耳和髎、丝竹空<\/td><\/tr><tr><th>手太阳小肠经<\/th><td>19<\/td><td>少泽、前谷、后溪、腕骨、阳谷、养老、支正、小海、肩贞、臑俞、天宗、秉风、曲垣、肩外俞、肩中俞、天窗、天容、颧髎、听宫<\/td><\/tr><tr><th>足阳明胃经<\/th><td>45<\/td><td>承泣、四白、巨髎、地仓、大迎、颊车、下关、头维、人迎、水突、气舍、缺盆、气户、库房、屋翳、膺窗、乳中、乳根、不容、承满、梁门、关门、太乙、滑肉门、天枢、外陵、大巨、水道、归来、气冲、髀关、伏兔、阴市、梁丘、犊鼻、足三里、上巨虚、条口、下巨虚、丰隆、解溪、冲阳、陷谷、内庭、厉兑<\/td><\/tr><tr><th>足少阳胆经<\/th><td>44<\/td><td>瞳子髎、听会、上关、颔厌、悬颅、悬厘、曲鬓、率谷、天冲、浮白、头窍阴、完骨、本神、阳白、头临泣、目窗、正营、承灵、脑空、风池、肩井、渊腋、辄筋、日月、京门、带脉、五枢、维道、居髎、环跳、风市、中渎、膝阳关、阳陵泉、阳交、外丘、光明、阳辅、悬钟、丘墟、足临泣、地五会、侠溪、足窍阴<\/td><\/tr><tr><th>足太阳膀胱经<\/th><td>67<\/td><td>睛明、攒竹、眉冲、曲差、五处、承光、通天、络却、玉枕、天柱、大杼、风门、肺俞、厥阴俞、心俞、督俞、膈俞、肝俞、胆俞、脾俞、胃俞、三焦俞、肾俞、气海俞、大肠俞、关元俞、小肠俞、膀胱俞、中膂俞、白环俞、上髎、次髎、中髎、下髎、会阳、承扶、殷门、浮郄、委阳、委中、附分、魄户、膏肓、神堂、譩譆、膈关、魂门、阳纲、意舍、胃仓、肓门、志室、胞肓、秩边、合阳、承筋、承山、飞扬、跗阳、昆仑、仆参、申脉、金门、京骨、束骨、足通谷、至阴<\/td><\/tr><tr><th>足太阴脾经<\/th><td>21<\/td><td>隐白、大都、太白、公孙、商丘、三阴交、漏谷、地机、阴陵泉、血海、箕门、冲门、府舍、腹结、大横、腹哀、食窦、天溪、胸乡、周荣、大包<\/td><\/tr><tr><th>足厥阴肝经<\/th><td>14<\/td><td>大敦、行间、太冲、中封、蠡沟、中都、膝关、曲泉、阴包、足五里、阴廉、急脉、章门、期门<\/td><\/tr><tr><th>足少阴肾经<\/th><td>27<\/td><td>涌泉、然谷、太溪、大钟、水泉、照海、复溜、交信、筑宾、阴谷、横骨、大赫、气穴、四满、中注、肓俞、商曲、石关、阴都、腹通谷、幽门、步廊、神封、灵墟、神藏、彧中、俞府<\/td><\/tr><\/tbody><\/table>\n<h2>三、任脉与督脉<\/h2>\n<h3>任脉（24穴）<\/h3><p>会阴、曲骨、中极、关元、石门、气海、阴交、神阙、水分、下脘、建里、中脘、上脘、巨阙、鸠尾、中庭、膻中、玉堂、紫宫、华盖、璇玑、天突、廉泉、承浆<\/p>\n<h3>督脉（28穴）<\/h3><p>长强、腰俞、腰阳关、命门、悬枢、脊中、中枢、筋缩、至阳、灵台、神道、身柱、陶道、大椎、哑门、风府、脑户、强间、后顶、百会、前顶、囟会、上星、神庭、素髎、水沟、兑端、龈交<\/p>\n<h2>四、检索练习<\/h2>\n<ol><li>找出十二正经中穴数最多与最少的经脉。<\/li><li>查找列缺、后溪、公孙、内关分别属于哪条正经。<\/li><li>把任脉与督脉的首穴、末穴分别写出。<\/li><li>任选一条经，只按每五个穴为一组朗读；合上页面后复述组间顺序。<\/li><\/ol>\n<h2>五、下一步需要什么资料<\/h2>\n<p>名称表适合检索，却不足以学习准确定位。后续篇章若要加入体表定位、骨度分寸、解剖层次、针刺风险或主治证据，需要采用权威教材或标准，并对图像版权与医学安全进行单独审核。<\/p>\n<nav class=\"series-navigation\" aria-label=\"教程导航\"><a href=\"../meridian_tutorial_02_extraordinary_vessels/editor.html\">← 上一篇：经络阅读教程（二）：奇经八脉与八脉交会穴<\/a><a href=\"../../../index.html#reader_articles\">返回 Reader Articles<\/a><\/nav>", "footnotes": [], "notes": "Source conversation: https://chat.deepseek.com/share/km6zn4kmhm71ody7cp\nEducational use only; not medical advice or self-needling instruction.", "splitPercent": 50}</script><script src="../../workspace.js"></script></body></html>
