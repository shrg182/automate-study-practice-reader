<script src="../../../workspace_skin.js"></script><script id="readerArticleSeed" type="application/json">{"schema": "reader-article-v1", "id": "18afcbb9-4df0-512e-86dc-52523fafb70e", "savedAt": "2026-09-20T12:00:00+08:00", "metadata": {"type": "Reading material", "date": "2026-09-20", "title": "经络阅读教程（一）：先建立十二经脉的框架", "byline": "Reader tutorial · assembled from user-provided material"}, "bodyHTML": "<nav class=\"series-navigation\" aria-label=\"教程导航\"><a href=\"../../../index.html#reader_articles\">返回 Reader Articles<\/a><a href=\"../meridian_tutorial_02_extraordinary_vessels/editor.html\">下一篇：经络阅读教程（二）：奇经八脉与八脉交会穴 →<\/a><\/nav>\n<p><strong>学习目标：<\/strong>读完本文，能够区分“经络”与“经脉”，按手足、阴阳和脏腑说出十二经脉，并用四句走向规律和一条流注链组织记忆。<\/p>\n<p class=\"callout\"><strong>安全说明：<\/strong>本文是传统医学知识阅读材料，不提供诊断或自行针刺指导。穴位定位与针刺操作应由受过训练、符合当地资质要求的专业人员完成。<\/p>\n<h2>一、先把名称说准确<\/h2>\n<p>“经络”是经脉与络脉的总称。日常所说的“十二经络”，更准确的名称是<strong>十二经脉<\/strong>或<strong>十二正经<\/strong>。可以先把经脉理解为系统中的主干，把络脉理解为由主干分出的网络。这是一种传统理论模型，不应直接等同于现代解剖中的神经或血管。<\/p>\n<h2>二、十二经脉的四组分类<\/h2>\n<table><thead><tr><th>类别<\/th><th>三条经脉<\/th><\/tr><\/thead><tbody>\n<tr><th>手三阴<\/th><td>手太阴肺经、手厥阴心包经、手少阴心经<\/td><\/tr>\n<tr><th>手三阳<\/th><td>手阳明大肠经、手少阳三焦经、手太阳小肠经<\/td><\/tr>\n<tr><th>足三阳<\/th><td>足阳明胃经、足少阳胆经、足太阳膀胱经<\/td><\/tr>\n<tr><th>足三阴<\/th><td>足太阴脾经、足厥阴肝经、足少阴肾经<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>读名方法：<\/strong>每个名称依次给出三条信息：在手还是在足、属于哪一种阴阳层次、联系哪个传统脏腑系统。例如“足少阴肾经”可拆为“足—少阴—肾”。<\/p>\n<h2>三、六组表里配对<\/h2>\n<p>肺—大肠，心包—三焦，心—小肠，脾—胃，肝—胆，肾—膀胱。配对属于传统功能联系，不表示两个现代解剖器官直接相连。<\/p>\n<h2>四、用四句话掌握走向<\/h2>\n<ul><li>手三阴：从胸走手。<\/li><li>手三阳：从手走头。<\/li><li>足三阳：从头走足。<\/li><li>足三阴：从足走腹胸。<\/li><\/ul>\n<p>阅读具体循行前，先判断它属于哪一组，再检查起止的大方向。这个框架比一开始逐字背诵长路线更稳固。<\/p>\n<h2>五、把流注读成一条闭环<\/h2>\n<p><strong>肺 → 大肠 → 胃 → 脾 → 心 → 小肠 → 膀胱 → 肾 → 心包 → 三焦 → 胆 → 肝 → 肺。<\/strong><\/p>\n<p>第一遍只记顺序；第二遍标出每一次“阴—阳”或“阳—阴”的转换；第三遍再把手足与表里配对叠加进去。这样形成的是可解释的结构，而不是孤立名单。<\/p>\n<h2>六、自测<\/h2>\n<ol><li>“十二经络”为什么不是最严谨的名称？<\/li><li>不看正文，写出四类经脉及每类的走向。<\/li><li>找出肝经的表里经，并指出它在流注链中的前后两经。<\/li><li>为什么不能把经脉直接称为神经或血管？<\/li><\/ol>\n<nav class=\"series-navigation\" aria-label=\"教程导航\"><a href=\"../../../index.html#reader_articles\">返回 Reader Articles<\/a><a href=\"../meridian_tutorial_02_extraordinary_vessels/editor.html\">下一篇：经络阅读教程（二）：奇经八脉与八脉交会穴 →<\/a><\/nav>", "footnotes": [], "notes": "Source conversation: https://chat.deepseek.com/share/km6zn4kmhm71ody7cp\nEducational use only; not medical advice or self-needling instruction.", "splitPercent": 50}</script><script src="../../workspace.js"></script></body></html>
