<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reader Articles Studio</title><link rel="stylesheet" href="workspace.css"></head><body>
<header class="topbar"><strong class="brand">Reader Articles Studio</strong><a href="../index.html#reader_articles">Reader catalog</a><span class="status" id="status">New draft</span></header>
<nav class="toolbar writing-header-tools" aria-label="Article tools"><button id="newBtn">New article</button><button id="saveBtn">Save</button><button data-command="undo">Undo</button><button data-command="redo">Redo</button><button data-command="formatBlock" data-value="h2">H2</button><button data-command="formatBlock" data-value="p">¶</button><button data-command="bold"><b>B</b></button><button data-command="italic"><i>I</i></button><button data-command="underline"><u>U</u></button><button data-command="strikeThrough"><s>S</s></button><button data-command="insertUnorderedList">• List</button><button data-command="insertOrderedList">1. List</button><button id="linkBtn">Link</button><button class="color" data-command="hiliteColor" data-value="#fff1a8" title="Yellow highlight"><i style="background:#fff1a8"></i></button><button class="color" data-command="hiliteColor" data-value="#dff0d2" title="Green highlight"><i style="background:#dff0d2"></i></button><button class="color" data-command="hiliteColor" data-value="#dcebf7" title="Blue highlight"><i style="background:#dcebf7"></i></button><button class="color" data-command="hiliteColor" data-value="#e7d8f2" title="Purple highlight"><i style="background:#e7d8f2"></i></button><button id="clearFormat">Clear format</button><button id="footnoteBtn">Add footnote</button><button id="imageBtn">Insert image</button><input class="hidden" id="imageInput" type="file" accept="image/*"><button id="exportBtn">Export backup</button><label class="button" for="importInput">Import backup</label><input class="hidden" id="importInput" type="file" accept="application/json,.json"><button class="primary" id="pdfBtn">Generate PDF</button></nav>
<main class="workspace" id="workspace"><section class="pane author-pane" aria-label="Editable article"><div class="metadata"><label>Type<select id="articleType"><option>Article</option><option>News report</option><option>Essay</option><option>Study report</option><option>Reading material</option></select></label><label>Date<input id="articleDate" type="date"></label><label class="wide">Title<input id="articleTitle" placeholder="Article title"></label><label class="wide">Byline<input id="articleByline" placeholder="Author or byline"></label></div><article class="editor-card"><h2>Article text</h2><div class="editor" id="editor" contenteditable="true" spellcheck="true"></div></article><section class="notes-card"><h2>Notes and production instructions</h2><textarea id="notes" placeholder="Sources, questions, revision notes, or PDF instructions…"></textarea></section></section><div class="splitter" id="splitter" role="separator" aria-label="Resize text and preview panes"></div><section class="pane preview-pane" aria-label="PDF preview"><article class="page" id="previewPage"><header><div class="type" id="previewType"></div><h1 id="previewTitle"></h1><div class="meta" id="previewMeta"></div></header><div class="preview-body" id="previewBody"></div><section class="preview-footnotes" id="previewFootnotes"></section><aside class="preview-note" id="previewNote" hidden></aside></article></section></main>
<script src="workspace.js"></script></body></html>
