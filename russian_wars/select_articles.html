const battles={"02_great_northern_war@period_05_1689_1801": [{"date": "1700", "ru": "Битва при Нарве", "en": "Battle of Narva", "zh": "纳尔瓦战役", "note": "Крупное поражение русской армии в начале войны; ускорило военную реорганизацию."}, {"date": "1709", "ru": "Полтавская битва", "en": "Battle of Poltava", "zh": "波尔塔瓦战役", "note": "Решающая победа России над главной армией Карла XII."}, {"date": "1714", "ru": "Гангутское сражение", "en": "Battle of Gangut", "zh": "汉科海战", "note": "Первая крупная победа русского галерного флота."}], "02_patriotic_war_1812@period_06_1801_1855": [{"date": "1812", "ru": "Смоленское сражение", "en": "Battle of Smolensk", "zh": "斯摩棱斯克战役", "note": "Русские армии продолжили организованное отступление после тяжёлых боёв."}, {"date": "1812", "ru": "Бородинское сражение", "en": "Battle of Borodino", "zh": "博罗季诺战役", "note": "Крайне кровопролитное генеральное сражение без уничтожения русской армии."}, {"date": "1812", "ru": "Сражение под Малоярославцем", "en": "Battle of Maloyaroslavets", "zh": "小雅罗斯拉韦茨战役", "note": "Повлияло на направление французского отступления из Москвы."}, {"date": "1812", "ru": "Сражение на Березине", "en": "Battle of Berezina", "zh": "别列津纳河战役", "note": "Французская армия переправилась с большими потерями и продолжила отступление."}], "03_crimean_war@period_06_1801_1855": [{"date": "1854", "ru": "Сражение на Альме", "en": "Battle of the Alma", "zh": "阿尔马河战役", "note": "Победа союзников открыла путь к осаде Севастополя."}, {"date": "1854", "ru": "Балаклавское сражение", "en": "Battle of Balaclava", "zh": "巴拉克拉瓦战役", "note": "Неоднозначное сражение, известное кавалерийскими атаками и борьбой за коммуникации."}, {"date": "1854", "ru": "Инкерманское сражение", "en": "Battle of Inkerman", "zh": "因克尔曼战役", "note": "Неудачная попытка русских войск снять осаду Севастополя."}, {"date": "1854–1855", "ru": "Оборона Севастополя", "en": "Siege of Sevastopol", "zh": "塞瓦斯托波尔围城战", "note": "Главная и почти годичная кампания войны в Крыму."}], "02_russo_japanese_war@period_07_1855_1917": [{"date": "1904–1905", "ru": "Оборона Порт-Артура", "en": "Siege of Port Arthur", "zh": "旅顺围攻战", "note": "Длительная осада завершилась капитуляцией российской крепости."}, {"date": "1904", "ru": "Ляоянское сражение", "en": "Battle of Liaoyang", "zh": "辽阳会战", "note": "Крупное сухопутное сражение, после которого русская армия отступила к Мукдену."}, {"date": "1905", "ru": "Мукденское сражение", "en": "Battle of Mukden", "zh": "奉天会战", "note": "Одно из крупнейших сухопутных сражений эпохи до Первой мировой войны."}, {"date": "1905", "ru": "Цусимское сражение", "en": "Battle of Tsushima", "zh": "对马海战", "note": "Решительная победа японского флота над Второй Тихоокеанской эскадрой."}], "02_russian_civil_war@period_08_1917_1922": [{"date": "1918", "ru": "Казанская операция", "en": "Kazan operation", "zh": "喀山战役", "note": "Взятие Казани Красной армией стало важным поворотом на Восточном фронте."}, {"date": "1919", "ru": "Орловско-Кромская операция", "en": "Orel–Kromy operation", "zh": "奥廖尔—克罗梅战役", "note": "Красная армия остановила наступление сил Деникина на московском направлении."}, {"date": "1920", "ru": "Перекопско-Чонгарская операция", "en": "Perekop–Chongar operation", "zh": "彼列科普—琼加尔战役", "note": "Прорыв в Крым привёл к поражению основных сил Русской армии Врангеля."}], "02_winter_war@period_09_1922_1941": [{"date": "1939", "ru": "Битва при Толваярви", "en": "Battle of Tolvajärvi", "zh": "托尔瓦耶尔维战役", "note": "Заметная финская победа на раннем этапе войны."}, {"date": "1939–1940", "ru": "Сражение при Суомуссалми", "en": "Battle of Suomussalmi", "zh": "苏奥穆斯萨尔米战役", "note": "Финские силы разгромили несколько советских соединений в сложных зимних условиях."}, {"date": "1940", "ru": "Бои за Сумму", "en": "Battles of Summa", "zh": "苏马战役", "note": "Ключевые бои при прорыве главной полосы линии Маннергейма."}], "02_great_patriotic_war@period_10_1939_1945": [{"date": "1941–1942", "ru": "Битва за Москву", "en": "Battle of Moscow", "zh": "莫斯科战役", "note": "Срыв германского плана захвата столицы и первое крупное стратегическое контрнаступление Красной армии."}, {"date": "1942–1943", "ru": "Сталинградская битва", "en": "Battle of Stalingrad", "zh": "斯大林格勒战役", "note": "Окружение и капитуляция крупной группировки стран Оси изменили стратегическую обстановку."}, {"date": "1943", "ru": "Курская битва", "en": "Battle of Kursk", "zh": "库尔斯克战役", "note": "После отражения германского наступления стратегическая инициатива закрепилась за Красной армией."}, {"date": "1944", "ru": "Операция «Багратион»", "en": "Operation Bagration", "zh": "巴格拉季昂行动", "note": "Разгром германской группы армий «Центр» и освобождение Белоруссии."}, {"date": "1945", "ru": "Берлинская операция", "en": "Battle of Berlin", "zh": "柏林战役", "note": "Заключительная крупная операция в Европе, завершившаяся падением Берлина."}]};
const savedDraft=localStorage.getItem('russian-wars-selection-draft');
const savedLibrary=localStorage.getItem('russian-wars-library-ids');
const initial=savedDraft||savedLibrary||JSON.stringify(articles.map(x=>x.id+'@'+x.period));
const storedIds=JSON.parse(initial).map(key=>key.includes('@')?key:key+'@period_06_1801_1855');
const draft=new Set(storedIds);
const articleKey=x=>x.id+'@'+x.period;
const battleItemId=(x,index)=>'battle_'+x.id.replace(/^0[23]_/, '')+'_'+String(index+1).padStart(2,'0');
const battleKey=(x,index)=>battleItemId(x,index)+'@'+x.period;
const catalog=document.getElementById('catalog');
function filtered(){const q=document.getElementById('search').value.trim().toLocaleLowerCase(),p=document.getElementById('period').value,t=document.getElementById('type').value;return articles.filter(x=>(!p||x.period===p)&&(!t||x.type===t)&&(!q||`${x.ru} ${x.en_title} ${x.zh_title} ${x.year}`.toLocaleLowerCase().includes(q)))}
function save(){localStorage.setItem('russian-wars-selection-draft',JSON.stringify([...draft]));document.getElementById('count').textContent=`Выбрано: ${draft.size} · около ${Math.max(1,draft.size*12)} КБ`}
function battleMarkup(x){const list=battles[articleKey(x)]||[];if(!list.length)return'';return `<details class="battle-list"><summary>Крупнейшие сражения · ${list.length}</summary><ol>${list.map((b,index)=>`<li><label><input type="checkbox" data-key="${battleKey(x,index)}" ${draft.has(battleKey(x,index))?'checked':''}><span><time>${b.date}</time><strong>${b.ru}</strong><p>${b.note}</p><span class="links"><a href="${x.source}" target="_blank" rel="noreferrer">Источник</a><a href="${x.period}/${battleItemId(x,index)}/editor.html?view=annotated">Читать</a></span></span></label></li>`).join('')}</ol></details>`}
function render(){const visible=filtered();catalog.innerHTML=Object.entries(periods).map(([key,label])=>{const rows=visible.filter(x=>x.period===key);if(!rows.length)return'';return `<section class="period"><h2>${label} · ${rows.length} статей</h2>${rows.map((x,i)=>`<article class="row"><span>${String(i+1).padStart(2,'0')}</span><label><input type="checkbox" data-key="${articleKey(x)}" ${draft.has(articleKey(x))?'checked':''}><span><b>${x.ru}</b><span class="badges"><i>${x.type}</i><i>${x.year}</i></span></span></label><span class="links"><a href="${x.source}" target="_blank" rel="noreferrer">Источник</a><a href="${x.period}/${x.id}/editor.html?view=annotated">Читать</a></span>${battleMarkup(x)}</article>`).join('')}</section>`}).join('')||'<p class="empty">Нет подходящих статей.</p>';save()}
catalog.onchange=e=>{if(!e.target.dataset.key)return;e.target.checked?draft.add(e.target.dataset.key):draft.delete(e.target.dataset.key);save()};
document.getElementById('search').oninput=render;document.getElementById('period').onchange=render;document.getElementById('type').onchange=render;
document.getElementById('visible').onclick=()=>{const keys=filtered().map(articleKey),all=keys.every(key=>draft.has(key));keys.forEach(key=>all?draft.delete(key):draft.add(key));render()};
document.getElementById('remove').onclick=()=>{draft.clear();render()};
document.getElementById('import').onclick=()=>{localStorage.setItem('russian-wars-library-ids',JSON.stringify([...draft]));location.href='../index.html#russian_wars'};
render();
</script></body></html>
