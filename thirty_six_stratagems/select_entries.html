<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>《三十六计》篇目选择器</title><style>:root{--ink:#28251f;--paper:#fffdf8;--line:#d8d0c1;--accent:#74402e;--muted:#756f64}*{box-sizing:border-box}body{margin:0;background:#ebe6db;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{padding:40px max(24px,6vw);background:#302a24;color:#fff}h1{margin:8px 0;font:700 clamp(34px,6vw,60px)/1.08 "Songti SC",serif}header p{color:#ddd3c7}a{color:inherit}.shell{width:min(1050px,calc(100% - 32px));margin:22px auto}.controls{position:sticky;top:0;z-index:4;display:grid;grid-template-columns:1fr 160px auto;gap:8px;padding:12px;background:#ebe6dbed}input,select,button{min-height:40px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font:inherit}button{cursor:pointer}.primary{background:var(--accent);color:#fff}.queue{display:flex;gap:9px;flex-wrap:wrap;margin:0 12px 18px;padding:14px;background:var(--paper);border:1px solid var(--line)}.queue input[type=text]{flex:1;min-width:250px}.summary{margin:10px 12px;color:var(--muted)}.group{margin:18px 12px;border:1px solid var(--line);background:var(--paper)}.group h2{display:flex;justify-content:space-between;margin:0;padding:14px 16px;background:#f2ede4;font:700 21px "Songti SC",serif}.entry{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 15px;border-top:1px solid #e9e3d8}.entry label{display:flex;gap:10px}.entry input{min-height:0;width:17px;height:17px}.meta,.status{color:var(--muted);font-size:11px}.done{color:#477052;font-weight:700}.links{display:flex;gap:7px}.links a{padding:6px 8px;border:1px solid var(--line);border-radius:5px;text-decoration:none;font-size:12px}@media(max-width:680px){.controls{grid-template-columns:1fr}.entry{grid-template-columns:28px 1fr}.links{grid-column:2}}</style></head><body><header><a href="../index.html">← 返回校读书斋</a><h1>《三十六计》篇目选择器</h1><p>选择需要整理的篇目，导出处理清单后按需生成编辑器与 PDF。</p></header><main class="shell"><div class="controls"><input id="search" type="search" placeholder="搜索篇目"><select id="group"><option value="">全部分类</option></select><button id="selectVisible">选中当前结果</button></div><div class="queue"><input id="url" type="text" placeholder="粘贴篇目链接"><button id="add">加入选择</button><label><input id="pdf" type="checkbox"> 同时生成 PDF</label><button class="primary" id="export">导出处理清单</button></div><p class="summary" id="summary"></p><div id="catalog"></div></main><script>const DATA=[{"sequence": "1", "group": "胜战计", "title": "瞒天过海第一", "source_url": "https://www.guwendao.net/guwen/bookv_bee7b3fdc596.aspx", "editor": "01_entry_01/editor.html"}, {"sequence": "2", "group": "胜战计", "title": "围魏救赵第二", "source_url": "https://www.guwendao.net/guwen/bookv_c504d78e94de.aspx", "editor": "02_entry_02/editor.html"}, {"sequence": "3", "group": "胜战计", "title": "借刀杀人第三", "source_url": "https://www.guwendao.net/guwen/bookv_f76fac694f3f.aspx", "editor": "03_entry_03/editor.html"}, {"sequence": "4", "group": "胜战计", "title": "以逸待劳第四", "source_url": "https://www.guwendao.net/guwen/bookv_ae3263b13033.aspx", "editor": ""}, {"sequence": "5", "group": "胜战计", "title": "趁火打劫第五", "source_url": "https://www.guwendao.net/guwen/bookv_8c3b74b3e1fc.aspx", "editor": ""}, {"sequence": "6", "group": "胜战计", "title": "声东击西第六", "source_url": "https://www.guwendao.net/guwen/bookv_e829476e79b3.aspx", "editor": ""}, {"sequence": "7", "group": "敌战计", "title": "无中生有第七", "source_url": "https://www.guwendao.net/guwen/bookv_7b7ae6b3466f.aspx", "editor": ""}, {"sequence": "8", "group": "敌战计", "title": "暗渡陈仓第八", "source_url": "https://www.guwendao.net/guwen/bookv_6e1c0ca61136.aspx", "editor": ""}, {"sequence": "9", "group": "敌战计", "title": "隔岸观火第九", "source_url": "https://www.guwendao.net/guwen/bookv_3db422adae54.aspx", "editor": ""}, {"sequence": "10", "group": "敌战计", "title": "笑里藏刀第十", "source_url": "https://www.guwendao.net/guwen/bookv_610bf7b42965.aspx", "editor": ""}, {"sequence": "11", "group": "敌战计", "title": "李代桃僵第十一", "source_url": "https://www.guwendao.net/guwen/bookv_839c6af33311.aspx", "editor": ""}, {"sequence": "12", "group": "敌战计", "title": "顺手牵羊第十二", "source_url": "https://www.guwendao.net/guwen/bookv_a90115dfe691.aspx", "editor": ""}, {"sequence": "13", "group": "攻战计", "title": "打草惊蛇第十三", "source_url": "https://www.guwendao.net/guwen/bookv_7f0c35a7384e.aspx", "editor": ""}, {"sequence": "14", "group": "攻战计", "title": "借尸还魂第十四", "source_url": "https://www.guwendao.net/guwen/bookv_49cb42a1e550.aspx", "editor": ""}, {"sequence": "15", "group": "攻战计", "title": "调虎离山第十五", "source_url": "https://www.guwendao.net/guwen/bookv_c8676dd73c88.aspx", "editor": ""}, {"sequence": "16", "group": "攻战计", "title": "欲擒故纵第十六", "source_url": "https://www.guwendao.net/guwen/bookv_52ee18ac221c.aspx", "editor": ""}, {"sequence": "17", "group": "攻战计", "title": "抛砖引玉第十七", "source_url": "https://www.guwendao.net/guwen/bookv_ded244ca6b48.aspx", "editor": ""}, {"sequence": "18", "group": "攻战计", "title": "擒贼擒王第十八", "source_url": "https://www.guwendao.net/guwen/bookv_e894ebcff6f2.aspx", "editor": ""}, {"sequence": "19", "group": "混战计", "title": "釜底抽薪第十九", "source_url": "https://www.guwendao.net/guwen/bookv_472cc660c54d.aspx", "editor": ""}, {"sequence": "20", "group": "混战计", "title": "混水摸鱼第二十", "source_url": "https://www.guwendao.net/guwen/bookv_e7401b800996.aspx", "editor": ""}, {"sequence": "21", "group": "混战计", "title": "金蝉脱壳第二十一", "source_url": "https://www.guwendao.net/guwen/bookv_dd243553af74.aspx", "editor": ""}, {"sequence": "22", "group": "混战计", "title": "关门捉贼第二十二", "source_url": "https://www.guwendao.net/guwen/bookv_5b50bb7564f9.aspx", "editor": ""}, {"sequence": "23", "group": "混战计", "title": "远交近攻第二十三", "source_url": "https://www.guwendao.net/guwen/bookv_8c034c45afa0.aspx", "editor": ""}, {"sequence": "24", "group": "混战计", "title": "假道伐虢第二十四", "source_url": "https://www.guwendao.net/guwen/bookv_5b2752ddf365.aspx", "editor": ""}, {"sequence": "25", "group": "并战计", "title": "偷梁换柱第二十五", "source_url": "https://www.guwendao.net/guwen/bookv_2288fa93d263.aspx", "editor": ""}, {"sequence": "26", "group": "并战计", "title": "指桑骂槐第二十六", "source_url": "https://www.guwendao.net/guwen/bookv_ae6ec2ca7087.aspx", "editor": ""}, {"sequence": "27", "group": "并战计", "title": "假痴不癫第二十七", "source_url": "https://www.guwendao.net/guwen/bookv_c5cab49b548c.aspx", "editor": ""}, {"sequence": "28", "group": "并战计", "title": "上屋抽梯第二十八", "source_url": "https://www.guwendao.net/guwen/bookv_4a63d979b05d.aspx", "editor": ""}, {"sequence": "29", "group": "并战计", "title": "树上开花第二十九", "source_url": "https://www.guwendao.net/guwen/bookv_6b35ab15fa01.aspx", "editor": ""}, {"sequence": "30", "group": "并战计", "title": "反客为主第三十", "source_url": "https://www.guwendao.net/guwen/bookv_6e67fd599dca.aspx", "editor": ""}, {"sequence": "31", "group": "败战计", "title": "美人计第三十一", "source_url": "https://www.guwendao.net/guwen/bookv_58b7d5e79c11.aspx", "editor": ""}, {"sequence": "32", "group": "败战计", "title": "空城计第三十二", "source_url": "https://www.guwendao.net/guwen/bookv_b5e2d37490e6.aspx", "editor": ""}, {"sequence": "33", "group": "败战计", "title": "反间计第三十三", "source_url": "https://www.guwendao.net/guwen/bookv_13f5341b6954.aspx", "editor": ""}, {"sequence": "34", "group": "败战计", "title": "苦肉计第三十四", "source_url": "https://www.guwendao.net/guwen/bookv_202a013d00aa.aspx", "editor": ""}, {"sequence": "35", "group": "败战计", "title": "连环计第三十五", "source_url": "https://www.guwendao.net/guwen/bookv_656d9db1a633.aspx", "editor": ""}, {"sequence": "36", "group": "败战计", "title": "走为上计第三十六", "source_url": "https://www.guwendao.net/guwen/bookv_c4ce6bca2b7b.aspx", "editor": ""}],KEY='thirty_six_stratagems',chosen=new Set(JSON.parse(localStorage.getItem(KEY+'-selected')||'[]')),catalog=document.getElementById('catalog'),search=document.getElementById('search'),group=document.getElementById('group'),summary=document.getElementById('summary'),groups=[...new Set(DATA.map(x=>x.group))];groups.forEach(x=>group.add(new Option(x,x)));function visible(){const q=search.value.trim();return DATA.filter(x=>(!group.value||x.group===group.value)&&(!q||x.title.includes(q)||x.sequence===q))}function save(){localStorage.setItem(KEY+'-selected',JSON.stringify([...chosen]));summary.textContent=`已选 ${chosen.size} 篇 · 共 ${DATA.length} 篇`}function render(){const ids=new Set(visible().map(x=>x.sequence));catalog.innerHTML='';for(const part of groups){const rows=DATA.filter(x=>x.group===part&&ids.has(x.sequence));if(!rows.length)continue;const box=document.createElement('section');box.className='group';box.innerHTML=`<h2><span>${part}</span><small>${rows.length} 篇</small></h2>`;for(const x of rows){const row=document.createElement('div');row.className='entry';row.innerHTML=`<span class="meta">${x.sequence}</span><label><input type="checkbox" data-id="${x.sequence}" ${chosen.has(x.sequence)?'checked':''}><span>${x.title} <small class="status ${x.editor?'done':''}">${x.editor?'已生成编辑器':'未处理'}</small></span></label><span class="links"><a href="${x.source_url}" target="_blank">阅读原文</a>${x.editor?`<a href="${x.editor}" target="_blank">打开编辑器</a>`:''}</span>`;box.append(row)}catalog.append(box)}save()}catalog.onchange=e=>{if(!e.target.dataset.id)return;e.target.checked?chosen.add(e.target.dataset.id):chosen.delete(e.target.dataset.id);save()};search.oninput=render;group.onchange=render;document.getElementById('selectVisible').onclick=()=>{const ids=visible().map(x=>x.sequence),all=ids.every(x=>chosen.has(x));ids.forEach(x=>all?chosen.delete(x):chosen.add(x));render()};document.getElementById('add').onclick=()=>{const value=document.getElementById('url').value,x=DATA.find(x=>value===x.source_url||value.includes(x.source_url.split('/').pop()));if(!x)return alert('请粘贴本书的有效篇目链接。');chosen.add(x.sequence);group.value=x.group;search.value='';render()};document.getElementById('export').onclick=()=>{if(!chosen.size)return alert('请先选择篇目。');const data={version:1,collection:KEY,createdAt:new Date().toISOString(),generatePdfs:document.getElementById('pdf').checked,entries:DATA.filter(x=>chosen.has(x.sequence))},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=KEY+'_processing_queue.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();</script></body></html>
