<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>《孙子兵法》篇目选择器</title><style>:root{--ink:#28251f;--paper:#fffdf8;--line:#d8d0c1;--accent:#74402e;--muted:#756f64}*{box-sizing:border-box}body{margin:0;background:#ebe6db;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{padding:40px max(24px,6vw);background:#302a24;color:#fff}h1{margin:8px 0;font:700 clamp(34px,6vw,60px)/1.08 "Songti SC",serif}header p{color:#ddd3c7}a{color:inherit}.shell{width:min(1050px,calc(100% - 32px));margin:22px auto}.controls{position:sticky;top:0;z-index:4;display:grid;grid-template-columns:1fr 160px auto;gap:8px;padding:12px;background:#ebe6dbed}input,select,button{min-height:40px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font:inherit}button{cursor:pointer}.primary{background:var(--accent);color:#fff}.queue{display:flex;gap:9px;flex-wrap:wrap;margin:0 12px 18px;padding:14px;background:var(--paper);border:1px solid var(--line)}.queue input[type=text]{flex:1;min-width:250px}.summary{margin:10px 12px;color:var(--muted)}.group{margin:18px 12px;border:1px solid var(--line);background:var(--paper)}.group h2{display:flex;justify-content:space-between;margin:0;padding:14px 16px;background:#f2ede4;font:700 21px "Songti SC",serif}.entry{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 15px;border-top:1px solid #e9e3d8}.entry label{display:flex;gap:10px}.entry input{min-height:0;width:17px;height:17px}.meta,.status{color:var(--muted);font-size:11px}.done{color:#477052;font-weight:700}.links{display:flex;gap:7px}.links a{padding:6px 8px;border:1px solid var(--line);border-radius:5px;text-decoration:none;font-size:12px}@media(max-width:680px){.controls{grid-template-columns:1fr}.entry{grid-template-columns:28px 1fr}.links{grid-column:2}}</style></head><body><header><a href="../index.html">← 返回校读书房</a><h1>《孙子兵法》篇目选择器</h1><p>选择需要整理的篇目，导出处理清单后按需生成编辑器与 PDF。</p></header><main class="shell"><div class="controls"><input id="search" type="search" placeholder="搜索篇目"><select id="group"><option value="">全部分类</option></select><button id="selectVisible">选中当前结果</button></div><div class="queue"><input id="url" type="text" placeholder="粘贴篇目链接"><button id="add">加入选择</button><label><input id="pdf" type="checkbox"> 同时生成 PDF</label><button class="primary" id="export">导出处理清单</button></div><p class="summary" id="summary"></p><div id="catalog"></div></main><script>const DATA=[{"sequence": "1", "group": "十三篇", "title": "始计篇第一", "source_url": "https://www.guwendao.net/guwen/bookv_98fea5295abc.aspx", "editor": "01_entry_01/editor.html"}, {"sequence": "2", "group": "十三篇", "title": "作战篇第二", "source_url": "https://www.guwendao.net/guwen/bookv_5ba718ac5558.aspx", "editor": "02_entry_02/editor.html"}, {"sequence": "3", "group": "十三篇", "title": "谋攻篇第三", "source_url": "https://www.guwendao.net/guwen/bookv_012e0da3e872.aspx", "editor": "03_entry_03/editor.html"}, {"sequence": "4", "group": "十三篇", "title": "军形篇第四", "source_url": "https://www.guwendao.net/guwen/bookv_92e8fdc28896.aspx", "editor": ""}, {"sequence": "5", "group": "十三篇", "title": "兵势篇第五", "source_url": "https://www.guwendao.net/guwen/bookv_dbb2ad5755f6.aspx", "editor": ""}, {"sequence": "6", "group": "十三篇", "title": "虚实篇第六", "source_url": "https://www.guwendao.net/guwen/bookv_da1658f2011f.aspx", "editor": ""}, {"sequence": "7", "group": "十三篇", "title": "军争篇第七", "source_url": "https://www.guwendao.net/guwen/bookv_a5829a99f01e.aspx", "editor": ""}, {"sequence": "8", "group": "十三篇", "title": "九变篇第八", "source_url": "https://www.guwendao.net/guwen/bookv_1557fb0eb15f.aspx", "editor": ""}, {"sequence": "9", "group": "十三篇", "title": "行军篇第九", "source_url": "https://www.guwendao.net/guwen/bookv_cb5f2359b95d.aspx", "editor": ""}, {"sequence": "10", "group": "十三篇", "title": "地形篇第十", "source_url": "https://www.guwendao.net/guwen/bookv_44bb128788b1.aspx", "editor": ""}, {"sequence": "11", "group": "十三篇", "title": "九地篇第十一", "source_url": "https://www.guwendao.net/guwen/bookv_18975ec72ced.aspx", "editor": ""}, {"sequence": "12", "group": "十三篇", "title": "火攻篇第十二", "source_url": "https://www.guwendao.net/guwen/bookv_a32380013d86.aspx", "editor": ""}, {"sequence": "13", "group": "十三篇", "title": "用间篇第十三", "source_url": "https://www.guwendao.net/guwen/bookv_414bacc3722e.aspx", "editor": ""}],KEY='sunzi',chosen=new Set(JSON.parse(localStorage.getItem(KEY+'-selected')||'[]')),catalog=document.getElementById('catalog'),search=document.getElementById('search'),group=document.getElementById('group'),summary=document.getElementById('summary'),groups=[...new Set(DATA.map(x=>x.group))];groups.forEach(x=>group.add(new Option(x,x)));function visible(){const q=search.value.trim();return DATA.filter(x=>(!group.value||x.group===group.value)&&(!q||x.title.includes(q)||x.sequence===q))}function save(){localStorage.setItem(KEY+'-selected',JSON.stringify([...chosen]));summary.textContent=`已选 ${chosen.size} 篇 · 共 ${DATA.length} 篇`}function render(){const ids=new Set(visible().map(x=>x.sequence));catalog.innerHTML='';for(const part of groups){const rows=DATA.filter(x=>x.group===part&&ids.has(x.sequence));if(!rows.length)continue;const box=document.createElement('section');box.className='group';box.innerHTML=`<h2><span>${part}</span><small>${rows.length} 篇</small></h2>`;for(const x of rows){const row=document.createElement('div');row.className='entry';row.innerHTML=`<span class="meta">${x.sequence}</span><label><input type="checkbox" data-id="${x.sequence}" ${chosen.has(x.sequence)?'checked':''}><span>${x.title} <small class="status ${x.editor?'done':''}">${x.editor?'已生成编辑器':'未处理'}</small></span></label><span class="links"><a href="${x.source_url}" target="_blank">阅读原文</a>${x.editor?`<a href="${x.editor}" target="_blank">打开编辑器</a>`:''}</span>`;box.append(row)}catalog.append(box)}save()}catalog.onchange=e=>{if(!e.target.dataset.id)return;e.target.checked?chosen.add(e.target.dataset.id):chosen.delete(e.target.dataset.id);save()};search.oninput=render;group.onchange=render;document.getElementById('selectVisible').onclick=()=>{const ids=visible().map(x=>x.sequence),all=ids.every(x=>chosen.has(x));ids.forEach(x=>all?chosen.delete(x):chosen.add(x));render()};document.getElementById('add').onclick=()=>{const value=document.getElementById('url').value,x=DATA.find(x=>value===x.source_url||value.includes(x.source_url.split('/').pop()));if(!x)return alert('请粘贴本书的有效篇目链接。');chosen.add(x.sequence);group.value=x.group;search.value='';render()};document.getElementById('export').onclick=()=>{if(!chosen.size)return alert('请先选择篇目。');const data={version:1,collection:KEY,createdAt:new Date().toISOString(),generatePdfs:document.getElementById('pdf').checked,entries:DATA.filter(x=>chosen.has(x.sequence))},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=KEY+'_processing_queue.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();</script></body></html>
