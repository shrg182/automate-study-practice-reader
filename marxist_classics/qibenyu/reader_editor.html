<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>《戚本禹回忆录》阅读与编辑</title>
  <link rel="stylesheet" href="../../workspace_theme.css">
  <style>
    *{box-sizing:border-box} :root{--line:#d8d3c7;--paper:#fffdfa;--ink:#242424;--muted:#666;--accent:#176a3a}
    body{margin:0;background:#f5f3ed;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
    header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
    .titlebar,.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 14px}.titlebar{justify-content:space-between}.titlebar h1{margin:0;font-size:18px}.subtitle{color:var(--muted);font-size:12px}.title-actions,.chapter-nav{display:flex;align-items:center;gap:6px}.chapter-nav a[hidden]{display:none}.chapter-nav-floating{display:none}
    button,.button{min-height:34px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font:inherit;text-decoration:none;cursor:pointer}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.toolbar{border-top:1px solid #eee;background:#f6f8fb}.toolbar .group{display:flex;gap:5px;align-items:center;padding-right:8px;border-right:1px solid var(--line)}.toolbar label{display:inline-flex;align-items:center;gap:6px}.toolbar input[type=range]{width:88px}.toolbar input[type=search]{width:min(240px,30vw);min-height:34px;padding:6px 10px;border:1px solid var(--line);border-radius:6px}.toolbar.collapsed>:not(#toolbarToggle){display:none}.doubt{background:#f7d9d6;border-bottom:2px wavy #a52d24}.comment-anchor{background:#dcebf0;border-bottom:1px dashed #315b73}.footnote-ref{color:#8a1f1f;font-weight:700}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,1fr);gap:12px;height:calc(100vh - 112px);padding:12px}.pane{display:flex;min-width:0;min-height:0;flex-direction:column;border:1px solid var(--line);background:var(--paper);box-shadow:0 5px 18px #332b1d12}.pane-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border-bottom:1px solid var(--line);background:#eee8dc}.pane-head strong{font-size:14px}.status{color:var(--muted);font-size:12px}
    #editor{flex:1;overflow:auto;padding:26px 32px;font:17px/1.9 "Songti SC","STSong",serif;white-space:normal;outline:0}#editor:empty:before{content:attr(data-placeholder);color:#888}.source-body{flex:1;min-height:0;overflow:auto;background:#fff;color:#222}.source-empty{display:grid;place-items:center;min-height:100%;padding:30px;text-align:center;color:var(--muted);line-height:1.7}.source-empty>div{max-width:520px}.source-empty .button{display:inline-flex;margin:7px 3px;align-items:center}.source-document{padding:26px 30px;color:#222;font:16px/1.8 "Songti SC","STSong",serif}.source-document img{max-width:100%;height:auto}.source-document table{max-width:100%}
    html[data-reading-theme="night"] #editor a{color:#9ec1ff!important;font-weight:700;text-decoration:underline!important;text-decoration-thickness:1.5px!important;text-underline-offset:.2em!important}
    html[data-reading-theme="night"] .source-body,html[data-reading-theme="night"] .source-document,html[data-reading-theme="night"] .source-document table,html[data-reading-theme="night"] .source-document tbody,html[data-reading-theme="night"] .source-document tr,html[data-reading-theme="night"] .source-document td{background:#fffef8!important;color:#222!important}html[data-reading-theme="night"] .source-document a{color:#174ea6!important;font-weight:700;text-decoration:underline!important;text-decoration-thickness:1.5px!important;text-underline-offset:.2em!important}
    mark{background:#ffe36e} @media(max-width:900px){.layout{grid-template-columns:1fr;height:auto}.pane{min-height:70vh}.source-pane{min-height:60vh}}
    body.reading-immersive .chapter-nav-floating{position:fixed;z-index:1000;right:14px;bottom:14px;display:flex;gap:7px}body.reading-immersive #editor{max-width:min(1400px,calc(100vw - clamp(36px,8vw,150px)))!important;text-align:justify;text-justify:inter-ideograph}body.reading-immersive #editor>*{max-width:100%!important}body.reading-immersive #editor p{text-align:justify!important}
  </style>
  <script src="../../workspace_skin.js"></script>
</head>
<body>
<header>
  <div class="titlebar"><div><h1 id="pageTitle">《戚本禹回忆录》</h1><div class="subtitle" id="pageSection"></div></div><div class="title-actions"><nav class="chapter-nav" aria-label="章节翻页"><a class="button" data-page="previous">← 上一页</a><a class="button" data-page="next">下一页 →</a></nav><a class="button" href="index.html">返回目录</a><a class="button" id="sourceLink" target="_blank" rel="noreferrer">打开原网页 ↗</a></div></div>
  <div class="toolbar" role="toolbar" aria-label="编辑工具">
    <button type="button" id="toolbarToggle" aria-expanded="true">收起工具栏</button>
    <div class="group"><button type="button" data-command="undo">撤销</button><button type="button" data-command="redo">重做</button></div>
    <div class="group" role="search"><input id="contentSearch" type="search" placeholder="搜索正文关键词"><button type="button" id="searchPrevBtn" title="上一个匹配">↑</button><button type="button" id="searchNextBtn" title="下一个匹配">↓</button><span id="contentSearchStatus" aria-live="polite"></span></div>
    <div class="group"><button type="button" data-command="bold"><b>B</b></button><button type="button" data-command="underline"><u>U</u></button><button type="button" id="highlightBtn">高亮</button></div>
    <div class="group"><button type="button" id="footnoteBtn">添加脚注</button><button type="button" id="commentBtn">插入按语</button><button type="button" id="doubtBtn">标为待核</button><button type="button" id="clearBtn">清除所选格式</button><a class="button" href="../../project_dictionary/index.html" target="_blank">全书词典</a></div>
    <div class="group"><button type="button" id="speakBtn">朗读选中/全文</button><button type="button" id="pauseBtn">暂停</button><button type="button" id="stopBtn">停止</button><select id="voiceSelect" aria-label="朗读声音"><option value="">系统默认声音</option></select><label>语速 <input id="rate" type="range" min="0.5" max="1.5" step="0.1" value="0.8"><span id="rateValue">0.8×</span></label></div>
    <div class="group"><button type="button" id="saveBtn">保存到浏览器</button><button type="button" id="exportTxtBtn">导出文本</button><button type="button" id="exportJsonBtn">备份 JSON</button><label class="button" for="importJson">导入备份</label><input id="importJson" type="file" accept="application/json,.json" hidden><label class="button primary">导入原网页文件<input id="sourceFile" type="file" accept=".html,.htm,text/html" hidden></label></div>
  </div>
</header>
<main class="layout">
  <section class="pane"><div class="pane-head"><strong>可编辑正文</strong><span class="status" id="saveStatus">尚未导入正文</span></div><div id="editor" contenteditable="true" spellcheck="false" data-placeholder="请先在右侧打开原网页，将页面存到电脑，然后使用“导入原网页文件”。导入后正文可在这里编辑。"></div></section>
  <aside class="pane source-pane"><div class="pane-head"><strong>原网页参考</strong><span class="status">导入后可并排核对</span></div><div class="source-body" id="sourceBody"><div class="source-empty"><div><p>原网站禁止第三方页面直接嵌入。请点击下面的按钮打开原网页，在浏览器中选择“存储页面”，再导入保存的 HTML 文件。</p><a class="button primary" id="sourceOpen" target="_blank" rel="noreferrer">打开原网页 ↗</a><p>导入只保存在当前浏览器中，不会把全书正文发布到本站。</p></div></div></div></aside>
</main>
<nav class="chapter-nav chapter-nav-floating" aria-label="全屏章节翻页"><a class="button" data-page="previous">← 上一页</a><a class="button" data-page="next">下一页 →</a></nav>
<script src="book_content.js"></script>
<script>
const params=new URLSearchParams(location.search),path=params.get('path')||'',requestedTitle=params.get('title')||'未命名章节',requestedSection=params.get('section')||'';
const safePath=/^(?:00[ab]|[1-5]-\d{2}|6)\.htm$/.test(path)?path:'';
const sourceUrl=`https://www.marxists.org/chinese/reference-books/qibenyu/${safePath}`;
const bundled=window.QIBENYU_BOOK_CONTENT?.[safePath],title=bundled?.title||requestedTitle,section=bundled?.section||requestedSection;
document.title=`${title} · 阅读与编辑`;pageTitle.textContent=title;pageSection.textContent=section;sourceLink.href=sourceOpen.href=sourceUrl;
const chapters=Object.entries(window.QIBENYU_BOOK_CONTENT||{}),chapterIndex=chapters.findIndex(([chapterPath])=>chapterPath===safePath);
function chapterHref(entry){const [chapterPath,chapter]=entry;const query=new URLSearchParams({path:chapterPath,title:chapter.title||'',section:chapter.section||''});return `reader_editor.html?${query}`}
document.querySelectorAll('[data-page="previous"]').forEach(link=>{if(chapterIndex>0)link.href=chapterHref(chapters[chapterIndex-1]);else link.hidden=true});
document.querySelectorAll('[data-page="next"]').forEach(link=>{if(chapterIndex>=0&&chapterIndex<chapters.length-1)link.href=chapterHref(chapters[chapterIndex+1]);else link.hidden=true});
document.addEventListener('keydown',event=>{if(!event.altKey||event.metaKey||event.ctrlKey)return;const direction=event.key==='ArrowLeft'?'previous':event.key==='ArrowRight'?'next':'';const link=direction&&document.querySelector(`[data-page="${direction}"]:not([hidden])`);if(link){event.preventDefault();link.click()}});
const editor=document.getElementById('editor'),sourceBody=document.getElementById('sourceBody'),saveStatus=document.getElementById('saveStatus');
const key=`qibenyu-editor-v1:${safePath}`;let timer;
function setStatus(text){saveStatus.textContent=text} function save(){localStorage.setItem(key,JSON.stringify({html:editor.innerHTML,source:sourceBody.querySelector('.source-document')?.innerHTML||'',updated:new Date().toISOString()}));setStatus('已自动保存')}
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved?.html){editor.innerHTML=saved.html;setStatus('已恢复浏览器存稿')}else if(bundled?.html){editor.innerHTML=bundled.html;setStatus('已载入书内正文')}if(saved?.source){sourceBody.innerHTML=`<article class="source-document">${saved.source}</article>`}else if(bundled?.html){sourceBody.innerHTML=`<article class="source-document">${bundled.html}</article>`}}catch{if(bundled?.html){editor.innerHTML=bundled.html;sourceBody.innerHTML=`<article class="source-document">${bundled.html}</article>`;setStatus('已载入书内正文')}}
editor.addEventListener('input',()=>{setStatus('正在编辑…');clearTimeout(timer);timer=setTimeout(save,500)});
document.querySelectorAll('[data-command]').forEach(button=>button.addEventListener('click',()=>{document.execCommand(button.dataset.command);editor.focus()}));
toolbarToggle.addEventListener('click',()=>{const collapsed=toolbarToggle.closest('.toolbar').classList.toggle('collapsed');toolbarToggle.textContent=collapsed?'展开工具栏':'收起工具栏';toolbarToggle.setAttribute('aria-expanded',String(!collapsed))});
highlightBtn.addEventListener('click',()=>{document.execCommand('hiliteColor',false,'#ffe36e');editor.focus()});clearBtn.addEventListener('click',()=>{document.execCommand('removeFormat');editor.focus()});
function selectionInEditor(){const selection=getSelection();return selection.rangeCount&&editor.contains(selection.anchorNode)?selection:null}
function markSelection(className,title=''){
  const selection=selectionInEditor();if(!selection||selection.isCollapsed){setStatus('请先选择正文');return}
  const range=selection.getRangeAt(0),span=document.createElement('span');span.className=className;if(title)span.title=title;
  try{range.surroundContents(span)}catch{span.append(range.extractContents());range.insertNode(span)}
  selection.removeAllRanges();save();editor.focus();
}
doubtBtn.addEventListener('click',()=>markSelection('doubt','待核内容'));
commentBtn.addEventListener('click',()=>{const note=prompt('请输入按语：','');if(note?.trim())markSelection('comment-anchor',`按语：${note.trim()}`)});
footnoteBtn.addEventListener('click',()=>{const note=prompt('请输入脚注：','');if(!note?.trim())return;const selection=selectionInEditor();if(!selection){setStatus('请将光标放在正文中');return}const sup=document.createElement('sup');sup.className='footnote-ref';sup.textContent='〔注〕';sup.title=note.trim();const range=selection.getRangeAt(0);range.collapse(false);range.insertNode(sup);selection.removeAllRanges();save();editor.focus()});
let searchMatches=[],searchIndex=-1;
function collectSearchMatches(){searchMatches=[];searchIndex=-1;const query=contentSearch.value.trim().toLocaleLowerCase();if(!query){contentSearchStatus.textContent='';return}const walker=document.createTreeWalker(editor,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){const text=node.nodeValue.toLocaleLowerCase();let start=0,index;while((index=text.indexOf(query,start))!==-1){const range=document.createRange();range.setStart(node,index);range.setEnd(node,index+query.length);searchMatches.push(range);start=index+Math.max(1,query.length)}}contentSearchStatus.textContent=searchMatches.length?`共 ${searchMatches.length} 处`:'无匹配'}
function showSearchMatch(step){if(!searchMatches.length)collectSearchMatches();if(!searchMatches.length)return;searchIndex=(searchIndex+step+searchMatches.length)%searchMatches.length;const selection=getSelection();selection.removeAllRanges();selection.addRange(searchMatches[searchIndex]);searchMatches[searchIndex].startContainer.parentElement?.scrollIntoView({block:'center',behavior:'smooth'});contentSearchStatus.textContent=`${searchIndex+1}/${searchMatches.length}`}
contentSearch.addEventListener('input',collectSearchMatches);contentSearch.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();showSearchMatch(event.shiftKey?-1:1)}});searchPrevBtn.addEventListener('click',()=>showSearchMatch(-1));searchNextBtn.addEventListener('click',()=>showSearchMatch(1));
let voices=[];function loadVoices(){voices=speechSynthesis.getVoices();const selected=voiceSelect.value;voiceSelect.innerHTML='<option value="">系统默认声音</option>';voices.forEach((voice,index)=>{const option=document.createElement('option');option.value=String(index);option.textContent=`${voice.name} (${voice.lang})`;voiceSelect.append(option)});voiceSelect.value=selected}loadVoices();speechSynthesis.addEventListener?.('voiceschanged',loadVoices);
rate.addEventListener('input',()=>rateValue.textContent=`${Number(rate.value).toFixed(1)}×`);speakBtn.addEventListener('click',()=>{speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(getSelection().toString().trim()||editor.innerText);utterance.lang='zh-CN';utterance.rate=Number(rate.value);utterance.voice=voices[Number(voiceSelect.value)]||null;speechSynthesis.speak(utterance)});pauseBtn.addEventListener('click',()=>{if(speechSynthesis.paused){speechSynthesis.resume();pauseBtn.textContent='暂停'}else{speechSynthesis.pause();pauseBtn.textContent='继续'}});stopBtn.addEventListener('click',()=>{speechSynthesis.cancel();pauseBtn.textContent='暂停'});
function download(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
saveBtn.addEventListener('click',save);exportTxtBtn.addEventListener('click',()=>download(`${safePath||'chapter'}-edited.txt`,editor.innerText));exportJsonBtn.addEventListener('click',()=>download(`${safePath||'chapter'}-backup.json`,JSON.stringify({path,title,section,html:editor.innerHTML,source:sourceBody.querySelector('.source-document')?.innerHTML||'',savedAt:new Date().toISOString()},null,2),'application/json'));
importJson.addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{const backup=JSON.parse(await file.text());if(typeof backup.html!=='string')throw new Error('missing html');editor.innerHTML=backup.html;if(typeof backup.source==='string'&&backup.source)sourceBody.innerHTML=`<article class="source-document">${backup.source}</article>`;save();setStatus('备份已导入并保存')}catch(error){console.error('Backup import failed',error);setStatus('备份导入失败：文件格式不正确')}finally{event.target.value=''}});
// Decode bytes before DOMParser: File.text() always assumes UTF-8.
function decodeSourceHtml(buffer){
  const bytes=new Uint8Array(buffer);
  if(bytes[0]===0xef&&bytes[1]===0xbb&&bytes[2]===0xbf)return new TextDecoder('utf-8',{fatal:true}).decode(bytes);
  if(bytes[0]===0xff&&bytes[1]===0xfe)return new TextDecoder('utf-16le',{fatal:true}).decode(bytes);
  if(bytes[0]===0xfe&&bytes[1]===0xff)return new TextDecoder('utf-16be',{fatal:true}).decode(bytes);
  const head=new TextDecoder('windows-1252').decode(bytes.slice(0,8192));
  const metas=head.match(/<meta\b[^>]*>/gi)||[];
  for(const meta of metas){
    const match=meta.match(/\bcharset\s*=\s*["']?\s*([a-z0-9._-]+)/i);
    if(match)return new TextDecoder(match[1],{fatal:true}).decode(bytes);
  }
  try{return new TextDecoder('utf-8',{fatal:true}).decode(bytes)}
  catch{return new TextDecoder('gb18030',{fatal:true}).decode(bytes)}
}
sourceFile.addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{const raw=decodeSourceHtml(await file.arrayBuffer()),doc=new DOMParser().parseFromString(raw,'text/html');doc.querySelectorAll('script,style,link,meta,base,noscript,iframe,object,embed,form').forEach(node=>node.remove());const candidate=doc.querySelector('main,article,.content,#content,body'),clone=candidate.cloneNode(true);clone.querySelectorAll('*').forEach(node=>[...node.attributes].forEach(attr=>{if(attr.name.toLowerCase().startsWith('on'))node.removeAttribute(attr.name)}));clone.querySelectorAll('a').forEach(a=>{const href=a.getAttribute('href');if(href)try{const url=new URL(href,sourceUrl);a.href=['http:','https:'].includes(url.protocol)?url.href:'#'}catch{a.removeAttribute('href')}});clone.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src');if(src)try{const url=new URL(src,sourceUrl);if(['http:','https:'].includes(url.protocol))img.src=url.href;else img.removeAttribute('src')}catch{img.removeAttribute('src')}});sourceBody.innerHTML='';const sourceArticle=document.createElement('article');sourceArticle.className='source-document';sourceArticle.innerHTML=clone.innerHTML;sourceBody.append(sourceArticle);if(!editor.innerText.trim())editor.innerHTML=clone.innerHTML;save();setStatus('原网页已导入并保存；已有正文保持不变')}catch(error){console.error('HTML import failed',error);setStatus('导入失败：请检查网页编码或浏览器存储空间，并备份现有正文')}finally{event.target.value=''}});
window.addEventListener('beforeunload',()=>{if(editor.innerHTML)save()});
</script>
<script src="../../mobile_pwa.js"></script>
</body></html>
