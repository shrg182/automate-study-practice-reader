ementById('summary');function all(){return [...DATA,...custom]}function visible(){const q=search.value.trim().toLocaleLowerCase();return all().filter(x=>!q||x.title.toLocaleLowerCase().includes(q)||x.source_url.toLocaleLowerCase().includes(q)||(x.section||'').toLocaleLowerCase().includes(q))}function save(){localStorage.setItem(KEY+'-selected',JSON.stringify([...chosen]));localStorage.setItem(CUSTOM_KEY,JSON.stringify(custom));const generated=DATA.filter(x=>x.editor).length;summary.textContent=`已选 ${chosen.size} 篇目 · 原书目录 ${DATA.length} 篇目 · 已生成 ${generated} 篇目 · 自定义 ${custom.length} 篇目`}function render(){const rows=visible();document.getElementById('visibleCount').textContent=`${rows.length} 篇目`;catalog.innerHTML='';let section='';rows.forEach((x,index)=>{if(x.section&&x.section!==section){section=x.section;const heading=document.createElement('h3');heading.className='section-heading';heading.textContent=section;catalog.append(heading)}const row=document.createElement('div');row.className='entry';row.innerHTML=`<span class="meta">${String(index+1).padStart(3,'0')}</span><label><input type="checkbox" data-id="${x.id}" ${chosen.has(x.id)?'checked':''}><span>${x.title} <small class="status ${x.editor?'done':''}">${x.editor?'已生成编辑器':'待处理'}</small></span></label><span class="links">${x.source_url?`<a href="${x.source_url}" target="_blank" rel="noreferrer">阅读原文</a>`:''}${x.editor?`<a href="${x.editor}?view=annotated" target="_blank">打开编辑器</a>`:''}</span>`;catalog.append(row)});save()}catalog.onchange=e=>{if(!e.target.dataset.id)return;e.target.checked?chosen.add(e.target.dataset.id):chosen.delete(e.target.dataset.id);save()};search.oninput=render;document.getElementById('selectVisible').onclick=()=>{const ids=visible().map(x=>x.id),selected=ids.length&&ids.every(x=>chosen.has(x));ids.forEach(x=>selected?chosen.delete(x):chosen.add(x));render()};document.getElementById('add').onclick=()=>{const title=document.getElementById('newTitle').value.trim(),source_url=document.getElementById('newUrl').value.trim();if(!title||!/^https?:\/\//i.test(source_url))return alert('请填写标题和有效的原文网址。');const id='custom-'+Date.now();custom.push({id,title,source_url,section:'自定义篇目',editor:''});chosen.add(id);document.getElementById('newTitle').value='';document.getElementById('newUrl').value='';search.value='';render()};document.getElementById('export').onclick=()=>{const entries=all().filter(x=>chosen.has(x.id));if(!entries.length)return alert('请先选择篇目。');const payload={version:1,collection:KEY,createdAt:new Date().toISOString(),entries},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download=KEY+'_processing_queue.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();
