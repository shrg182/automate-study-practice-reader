<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择二十四史 · Reader</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f3f4;color:#202124;font-family:Arial,"PingFang SC",sans-serif}header{padding:28px max(18px,5vw);background:#46372c;color:#fff}header a{color:#f6dd9b}main{width:min(960px,calc(100% - 28px));margin:18px auto 80px}.controls{position:sticky;top:0;display:flex;gap:8px;padding:10px;background:#f1f3f4}input[type=search]{min-width:0;flex:1;padding:10px;border:1px solid #bdc1c6;border-radius:7px}button{padding:9px 12px;border:1px solid #bdc1c6;border-radius:7px;background:#fff;cursor:pointer}button.primary{background:#188038;color:#fff}article{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid #dadce0;border-bottom:0;background:#fff}article:last-child{border-bottom:1px solid #dadce0}h2{margin:0;font-size:17px}p{margin:5px 0 0;color:#5f6368;font-size:12px}small{color:#8a6d3b}@media(max-width:600px){article{grid-template-columns:26px 1fr}article small{grid-column:2}}</style></head><body><header><a href="../index.html#mao_annotated_24_histories">← 书库</a><h1>选择二十四史</h1><p>先加入目录；扫描文件将在来源确认后按史、册或篇目单独离线保存。</p></header><main><div class="controls"><input id="q" type="search" placeholder="搜索史名、作者或结构"><button id="all">全选</button><button class="primary" id="save">加入书库</button></div><p id="count"></p><section id="list"></section></main><script>const books=[{"id": "shiji", "title": "史记", "author": "司马迁", "structure": "本纪、表、书、世家、列传"}, {"id": "hanshu", "title": "汉书", "author": "班固", "structure": "纪、表、志、传"}, {"id": "hou_hanshu", "title": "后汉书", "author": "范晔", "structure": "纪、志、传"}, {"id": "sanguozhi", "title": "三国志", "author": "陈寿", "structure": "魏书、蜀书、吴书"}, {"id": "jinshu", "title": "晋书", "author": "房玄龄等", "structure": "帝纪、志、列传、载记"}, {"id": "songshu", "title": "宋书", "author": "沈约", "structure": "本纪、志、列传"}, {"id": "nan_qishu", "title": "南齐书", "author": "萧子显", "structure": "本纪、志、列传"}, {"id": "liangshu", "title": "梁书", "author": "姚思廉", "structure": "本纪、列传"}, {"id": "chenshu", "title": "陈书", "author": "姚思廉", "structure": "本纪、列传"}, {"id": "weishu", "title": "魏书", "author": "魏收", "structure": "帝纪、志、列传"}, {"id": "bei_qishu", "title": "北齐书", "author": "李百药", "structure": "帝纪、列传"}, {"id": "zhoushu", "title": "周书", "author": "令狐德棻等", "structure": "帝纪、列传"}, {"id": "suishu", "title": "隋书", "author": "魏征等", "structure": "帝纪、志、列传"}, {"id": "nanshi", "title": "南史", "author": "李延寿", "structure": "本纪、列传"}, {"id": "beishi", "title": "北史", "author": "李延寿", "structure": "本纪、列传"}, {"id": "jiu_tangshu", "title": "旧唐书", "author": "刘昫等", "structure": "本纪、志、列传"}, {"id": "xin_tangshu", "title": "新唐书", "author": "欧阳修、宋祁", "structure": "本纪、志、表、列传"}, {"id": "jiu_wudaishi", "title": "旧五代史", "author": "薛居正等", "structure": "梁、唐、晋、汉、周书及志"}, {"id": "xin_wudaishi", "title": "新五代史", "author": "欧阳修", "structure": "本纪、家人传、臣传、考"}, {"id": "songshi", "title": "宋史", "author": "脱脱等", "structure": "本纪、志、表、列传"}, {"id": "liaoshi", "title": "辽史", "author": "脱脱等", "structure": "本纪、志、表、列传、国语解"}, {"id": "jinshi", "title": "金史", "author": "脱脱等", "structure": "本纪、志、表、列传"}, {"id": "yuanshi", "title": "元史", "author": "宋濂等", "structure": "本纪、志、表、列传"}, {"id": "mingshi", "title": "明史", "author": "张廷玉等", "structure": "本纪、志、表、列传"}],key='mao-24-histories-library',selected=new Set(JSON.parse(localStorage.getItem(key)||'[]')),list=document.getElementById('list');function render(){const q=document.getElementById('q').value.trim().toLowerCase(),shown=books.filter(x=>!q||`${x.title} ${x.author} ${x.structure}`.toLowerCase().includes(q));list.innerHTML=shown.map((x,i)=>`<article><span>${String(i+1).padStart(2,'0')}</span><label><input type="checkbox" data-id="${x.id}" ${selected.has(x.id)?'checked':''}> <span><h2>《${x.title}》</h2><p>${x.author} · ${x.structure}</p></span></label><small>扫描件待导入</small></article>`).join('');document.getElementById('count').textContent=`已选择 ${selected.size} / 24 部`}list.onchange=e=>{if(!e.target.dataset.id)return;e.target.checked?selected.add(e.target.dataset.id):selected.delete(e.target.dataset.id);render()};document.getElementById('q').oninput=render;document.getElementById('all').onclick=()=>{selected.size===books.length?selected.clear():books.forEach(x=>selected.add(x.id));render()};document.getElementById('save').onclick=()=>{localStorage.setItem(key,JSON.stringify([...selected]));location.href='overview/editor.html?view=annotated'};render();</script></body></html>
