<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>《中医基础理论》原书 PDF 工作台</title><style>
*{box-sizing:border-box}:root{--line:#d8d2c6;--green:#176b4b;--paper:#fff;--muted:#625e55}body{margin:0;background:#ebe8e0;color:#25231f;font-family:Arial,"PingFang SC",sans-serif;overflow:hidden}header{height:56px;display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:#fff}header a{color:var(--green);text-decoration:none}header strong{flex:1}header input{width:78px;padding:7px;border:1px solid var(--line);border-radius:5px}button,.button{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:inherit;cursor:pointer;text-decoration:none}button.primary{border-color:var(--green);background:var(--green);color:#fff}#allNotes[aria-pressed="true"]{border-color:var(--green);background:#e6f4ea;color:#137333;font-weight:700}main{height:calc(100vh - 56px);display:grid;grid-template-columns:minmax(420px,1fr) minmax(330px,420px)}.pdf-pane{min-width:0;background:#525659}iframe{width:100%;height:100%;border:0}aside{display:flex;min-width:0;flex-direction:column;border-left:1px solid var(--line);background:#f7f5ef}.aside-head{padding:13px;border-bottom:1px solid var(--line);background:#fff}.aside-head h1{margin:0;font-size:18px}.aside-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.composer{display:grid;grid-template-columns:90px 1fr;gap:7px;padding:10px;border-bottom:1px solid var(--line)}select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:5px;background:#fff;font:inherit}textarea{grid-column:1/-1;min-height:88px;resize:vertical}.composer .actions{grid-column:1/-1;display:flex;gap:7px;align-items:center}.composer label{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}.composer input[type=file]{display:none}#notes{flex:1;overflow:auto;padding:10px}.note{margin-bottom:9px;padding:11px;border:1px solid var(--line);border-radius:7px;background:#fff}.note:target,.note.note-target{border-color:#27805d;box-shadow:0 0 0 3px #dff2e8}.note header{height:auto;padding:0 0 7px;border:0;background:transparent}.note header b,.note header a{color:var(--green)}.note header time{margin-left:auto;color:var(--muted);font-size:10px}.note p{margin:4px 0;white-space:pre-wrap;line-height:1.55}.note p a{color:#176b4b;overflow-wrap:anywhere}.note img{max-width:100%;max-height:260px;margin-top:7px;border:1px solid var(--line)}.note button{padding:3px 7px;color:#a22;font-size:11px}.empty{padding:30px 12px;text-align:center;color:var(--muted)}@media(max-width:850px){body{overflow:auto}header{height:auto;flex-wrap:wrap}main{height:auto;display:flex;flex-direction:column}.pdf-pane{height:65vh}aside{min-height:65vh;border-left:0;border-top:1px solid var(--line)}}@media print{header,.composer{display:none}main{display:block}.pdf-pane{display:none}aside{border:0}}
</style><style>
.pane-balance{position:relative}.pane-balance-popover{position:absolute;z-index:30;top:calc(100% + 7px);right:0;display:none;width:min(350px,calc(100vw - 24px));padding:12px;border:1px solid #c9d2df;border-radius:10px;background:#fff;box-shadow:0 10px 30px #0003}.pane-balance.open .pane-balance-popover{display:grid;gap:11px}.pane-presets{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.pane-presets button{min-width:0;padding:6px 3px;font-size:11px}.pane-presets button.active{background:#e6f4ea;color:#137333;font-weight:700}.pane-slider{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;color:var(--muted);font-size:12px}.pane-slider input{width:100%;min-width:90px}.pane-output{grid-column:1/-1;color:#25231f;font-weight:700}main{grid-template-columns:minmax(0,var(--pdf-share,75fr)) minmax(0,var(--notes-share,25fr))}main.pdf-only,main.notes-only{grid-template-columns:1fr}main.pdf-only aside,main.notes-only .pdf-pane{display:none}@media(max-width:850px){main:not(.pdf-only):not(.notes-only){display:flex}.pane-balance-popover{position:fixed;top:70px;right:12px}}
</style></head><body><header><a href="index.html">← 教材目录</a><strong>原书 PDF · 629 页</strong><label>页码 <input id="page" type="number" min="1" max="629" value="1"></label><button id="jump">跳转</button><button id="allNotes" type="button" aria-pressed="false">全部札记</button><a class="button" href="中医基础理论.pdf" target="_blank">单独打开 PDF</a><a class="button" href="https://cjrjy.sdmpu.edu.cn/_upload/article/files/b6/78/0c1514014d6886af2888bbaa55f0/2ad29a5d-4340-464a-9a1e-c4b08b95ab3f.pdf" target="_blank" rel="noreferrer">大学来源页</a></header><main><section class="pdf-pane"><iframe id="pdf" title="中医基础理论原书 PDF" src="中医基础理论.pdf#page=1&view=FitH"></iframe></section><aside><div class="aside-head"><h1>页边札记</h1><p>按 PDF 页码保存笔记、批注、存疑和图片；资料只保存在当前浏览器。</p></div><div class="composer"><select id="kind"><option>笔记</option><option>批注</option><option>存疑</option><option>图片</option></select><input id="notePage" type="number" min="1" max="629" value="1" aria-label="笔记页码"><textarea id="text" placeholder="记录本页内容、术语、问题或图像说明…"></textarea><div class="actions"><label>选择图片<input id="image" type="file" accept="image/*"></label><span id="imageName"></span><button class="primary" id="save">保存札记</button><button id="export">导出</button></div></div><div id="notes"></div></aside></main><script>
const PDF='中医基础理论.pdf',DEFAULT_RECORDS=[{"id": "b7594aff-d7c0-4e39-a04c-6a9704142725", "page": 343, "kind": "批注", "text": "经络", "image": "", "created": "2026-08-28T17:17:39.478Z"}, {"id": "5faf6500-d706-4630-a939-0179a08b3825", "page": 284, "kind": "批注", "text": "气", "image": "", "created": "2026-08-28T17:18:58.311Z"}, {"id": "34e62223-0517-42d5-b5f4-e2fa12180755", "page": 284, "kind": "笔记", "text": "笔记 for page 284", "image": "", "created": "2026-08-28T17:19:25.336Z"}, {"id": "aa9e7d15-ee5a-42fc-a92b-9ad991341b9b", "page": 343, "kind": "批注", "text": "第四章 经络", "image": "", "created": "2026-08-28T17:20:42.952Z"}, {"id": "ffb42d54-fb29-40ce-9bd2-2fa1568809e5", "page": 343, "kind": "存疑", "text": "如何加入图片", "image": "", "created": "2026-08-28T17:21:31.754Z"}, {"id": "c71910e9-097d-40a4-a04f-ea527aa2505d", "page": 343, "kind": "笔记", "text": "这是笔记", "image": "", "created": "2026-08-28T17:21:51.859Z"}, {"id": "412f03d2-2d7c-4f3a-b5c0-4b89be65a9cd", "page": 343, "kind": "图片", "text": "https://www.a-hospital.com/w/%E7%BB%8F%E7%A9%B4%E7%A9%B4%E4%BD%8D%E5%9B%BE", "image": "", "created": "2026-08-28T17:23:14.440Z"}],storeKey='tcm-foundations-pdf-notes-v1',page=document.getElementById('page'),notePage=document.getElementById('notePage'),pdf=document.getElementById('pdf'),notes=document.getElementById('notes');
let records=[],pendingImage='',activeNote='',showAll=false;
const workspace=document.querySelector('main'),layoutKey='tcm-foundations-pdf-layout-v1',balance=document.createElement('div');
balance.className='pane-balance';balance.innerHTML='<button type="button" class="pane-balance-trigger" aria-expanded="false">分栏布局</button><div class="pane-balance-popover"><div class="pane-presets"><button type="button" data-share="0">仅 PDF</button><button type="button" data-share="25">PDF 优先</button><button type="button" data-share="50">均衡</button><button type="button" data-share="65">札记优先</button><button type="button" data-share="100">仅札记</button></div><label class="pane-slider"><span>PDF</span><input type="range" min="0" max="100" step="1" value="25" aria-label="札记窗格所占比例"><span>札记</span><output class="pane-output"></output></label></div>';document.querySelector('header strong').insertAdjacentElement('afterend',balance);
const balanceTrigger=balance.querySelector('.pane-balance-trigger'),balanceSlider=balance.querySelector('input'),balanceOutput=balance.querySelector('output');
function applyPaneShare(raw,persist=true){const share=Math.max(0,Math.min(100,Number(raw)||0));workspace.classList.toggle('pdf-only',share===0);workspace.classList.toggle('notes-only',share===100);workspace.style.setProperty('--pdf-share',`${100-share}fr`);workspace.style.setProperty('--notes-share',`${share}fr`);balanceSlider.value=String(share);balanceOutput.textContent=share===0?'仅 PDF':share===100?'仅札记':`PDF ${100-share}% · 札记 ${share}%`;balance.querySelectorAll('[data-share]').forEach(button=>button.classList.toggle('active',Number(button.dataset.share)===share));if(persist)localStorage.setItem(layoutKey,String(share))}
applyPaneShare(localStorage.getItem(layoutKey)??'25',false);balanceTrigger.onclick=e=>{e.stopPropagation();const open=balance.classList.toggle('open');balanceTrigger.setAttribute('aria-expanded',String(open))};balance.querySelector('.pane-presets').onclick=e=>{const button=e.target.closest('[data-share]');if(button)applyPaneShare(button.dataset.share)};balanceSlider.oninput=e=>applyPaneShare(e.target.value);document.addEventListener('click',e=>{if(!balance.contains(e.target)){balance.classList.remove('open');balanceTrigger.setAttribute('aria-expanded','false')}});
try{records=JSON.parse(localStorage.getItem(storeKey)||'[]')}catch{records=[]}const merged=new Map(DEFAULT_RECORDS.map(item=>[item.id,item]));records.forEach(item=>merged.set(item.id,item));records=[...merged.values()];
let pdfLoadToken=0;
function loadPdfPage(value){const token=++pdfLoadToken,target=`${PDF}#page=${value}&view=FitH`;pdf.src='about:blank';setTimeout(()=>{if(token===pdfLoadToken)pdf.src=target},0)}
function go(n,noteId=''){const value=Math.max(1,Math.min(629,Number(n)||1));showAll=false;activeNote=noteId;page.value=value;notePage.value=value;loadPdfPage(value);const params=new URLSearchParams(location.search);params.set('page',String(value));noteId?params.set('note',noteId):params.delete('note');history.replaceState(null,'',`${location.pathname}?${params}`);render();if(noteId)requestAnimationFrame(()=>document.getElementById(`note-${CSS.escape(noteId)}`)?.scrollIntoView({block:'center'}))}
function saveAll(){try{localStorage.setItem(storeKey,JSON.stringify(records));return true}catch(error){alert('本机札记空间已满。请先导出札记并删除部分图片后重试。');return false}}
function render(){const current=Number(page.value),shown=(showAll?records:records.filter(x=>x.page===current)).sort((a,b)=>showAll?(a.page-b.page||b.created.localeCompare(a.created)):b.created.localeCompare(a.created)),allButton=document.getElementById('allNotes');allButton.textContent=showAll?'返回本页':`全部札记（${records.length}）`;allButton.setAttribute('aria-pressed',String(showAll));notes.innerHTML=shown.length?shown.map(x=>`<article id="note-${x.id}" class="note${x.id===activeNote?' note-target':''}" data-id="${x.id}"><header><a href="?page=${x.page}&note=${encodeURIComponent(x.id)}"><b>第 ${x.page} 页 · ${x.kind}</b></a><time>${new Date(x.created).toLocaleString('zh-CN')}</time><button data-delete="${x.id}">删除</button></header>${x.text?`<p>${linkedText(x.text)}</p>`:''}${x.image?`<img src="${x.image}" alt="第 ${x.page} 页附图">`:''}</article>`).join(''):showAll?'<p class="empty">尚无札记。</p>':'<p class="empty">本页暂无札记。</p>'}
function escapeHtml(value){const node=document.createElement('div');node.textContent=value;return node.innerHTML}
function linkedText(value){const safe=escapeHtml(value);return /^https?:/i.test(value)?`<a href="${safe}" target="_blank" rel="noreferrer">${safe}</a>`:safe}
function prepareImage(file){const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{const limit=1400,scale=Math.min(1,limit/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);pendingImage=canvas.toDataURL('image/jpeg',.82);document.getElementById('imageName').textContent=`${file.name} · 已压缩`};image.onerror=()=>alert('无法读取所选图片。');image.src=reader.result};reader.onerror=()=>alert('无法读取所选图片。');reader.readAsDataURL(file)}
document.getElementById('jump').onclick=()=>go(page.value);page.onchange=()=>go(page.value);
document.getElementById('allNotes').onclick=()=>{showAll=!showAll;activeNote='';render();if(showAll)notes.scrollTop=0};
document.getElementById('image').onchange=e=>{const file=e.target.files[0];if(file){document.getElementById('imageName').textContent=`${file.name} · 处理中…`;prepareImage(file)}};
document.getElementById('save').onclick=()=>{const text=document.getElementById('text').value.trim(),kind=document.getElementById('kind').value,p=Number(notePage.value);if(!text&&!pendingImage)return alert('请填写札记或选择图片。');records.push({id:crypto.randomUUID?.()||String(Date.now()),page:Math.max(1,Math.min(629,p||1)),kind,text,image:pendingImage,created:new Date().toISOString()});if(!saveAll()){records.pop();return}document.getElementById('text').value='';document.getElementById('image').value='';document.getElementById('imageName').textContent='';pendingImage='';go(p)};
notes.onclick=e=>{const id=e.target.dataset.delete;if(!id)return;if(confirm('删除这条札记？')){const previous=records;records=records.filter(x=>x.id!==id);if(!saveAll())records=previous;render()}};
document.getElementById('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:2,book:'中医基础理论',exportedAt:new Date().toISOString(),notes:records.map(item=>({...item,anchor:`source_reader.html?page=${item.page}&note=${item.id}`,pdfAnchor:`${PDF}#page=${item.page}`}))},null,2)],{type:'application/json'}));a.download='中医基础理论_PDF札记.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};const initial=new URLSearchParams(location.search),initialNote=initial.get('note')||'',initialRecord=records.find(item=>item.id===initialNote);go(initialRecord?.page||initial.get('page')||1,initialNote);
</script><script>window.ReadingWorkspace={directoryHref:'../index.html',bookDirectoryHref:'index.html'};</script><script src="../mobile_pwa.js"></script></body></html>
