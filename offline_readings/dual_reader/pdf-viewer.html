<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PDF · Fit to width</title>
    <link rel="stylesheet" href="../../vendor/pdfjs/pdf_viewer.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f1f2ee;
      }
      #viewerContainer {
        position: absolute;
        inset: 0;
        overflow: auto;
        overscroll-behavior: contain;
      }
      .pdfViewer {
        --page-margin: 0 auto 8px;
        --page-border: 0;
        --scale-round-x: 1px;
        --scale-round-y: 1px;
      }
      .pdfViewer .page {
        border: 0;
      }
      #message {
        position: fixed;
        inset: 10px auto auto 10px;
        background: #fff;
        padding: 8px;
        font: 14px system-ui;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div id="message" role="status">Opening PDF…</div>
    <div id="viewerContainer" tabindex="0" aria-label="PDF pages, fitted to pane width">
      <div id="viewer" class="pdfViewer"></div>
    </div>
    <script type="module" src="pdf-viewer.js?v=reader-1.28.19"></script>
  </body>
</html>
