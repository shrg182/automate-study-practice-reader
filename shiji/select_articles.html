<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>《史记》篇目选择器</title><style>
:root{--ink:#28251f;--paper:#fffdf8;--line:#d8d0c1;--accent:#74402e;--muted:#756f64}*{box-sizing:border-box}body{margin:0;background:#ebe6db;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{padding:40px max(24px,6vw);background:#302a24;color:#fff}h1{margin:8px 0;font:700 clamp(34px,6vw,60px)/1.08 "Songti SC",serif}header p{max-width:760px;color:#ddd3c7;line-height:1.7}a{color:inherit}.shell{width:min(1050px,calc(100% - 32px));margin:22px auto 70px}.controls{position:sticky;top:0;z-index:4;display:flex;gap:8px;padding:12px;background:#ebe6dbed}.controls input{flex:1}input,button{min-height:40px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font:inherit}button{cursor:pointer}.primary{border-color:var(--accent);background:var(--accent);color:#fff}.queue{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;margin:0 12px 18px;padding:14px;background:var(--paper);border:1px solid var(--line)}.queue p{grid-column:1/-1;margin:0;color:var(--muted);font-size:13px}.summary{margin:10px 12px;color:var(--muted)}.group{margin:18px 12px;border:1px solid var(--line);background:var(--paper)}.group h2{display:flex;justify-content:space-between;margin:0;padding:14px 16px;background:#f2ede4;font:700 21px "Songti SC",serif}.entry{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 15px;border-top:1px solid #e9e3d8}.entry label{display:flex;gap:10px}.entry input{min-height:0;width:17px;height:17px}.meta,.status{color:var(--muted);font-size:11px}.done{color:#477052;font-weight:700}.links{display:flex;gap:7px}.links a{padding:6px 8px;border:1px solid var(--line);border-radius:5px;text-decoration:none;font-size:12px}@media(max-width:680px){.controls{position:static;flex-direction:column}.queue{grid-template-columns:1fr}.queue p{grid-column:auto}.entry{grid-template-columns:28px 1fr}.links{grid-column:2}}</style></head><body><header><a href="../index.html">← 返回校读书斋</a><h1>《史记》篇目选择器</h1><p>浏览已有的本纪、世家与列传，也可粘贴新的原文链接并导出处理清单。</p></header><main class="shell"><div class="controls"><input id="search" type="search" placeholder="搜索篇目"><button id="selectVisible">选中当前结果</button><button class="primary" id="export">导出处理清单</button></div><div class="queue"><p>添加尚未收录的篇目</p><input id="newTitle" type="text" placeholder="篇目标题"><input id="newUrl" type="url" placeholder="原文网址（https://…）"><button id="add">加入选择</button></div><p class="summary" id="summary"></p><section class="group"><h2><span>《史记》</span><small id="visibleCount"></small></h2><div id="catalog"></div></section></main><script>
const DATA=[{"id": "shiji_fanju_caize", "title": "七十列传·范雎蔡泽列传第十九", "source_url": "https://www.guwendao.net/guwen/bookv_fc115edcdd90.aspx", "editor": "shiji_fanju_caize/editor.html"}, {"id": "shiji_huaiyin_hou", "title": "七十列传·淮阴侯列传第三十二", "source_url": "https://www.guwendao.net/guwen/bookv_30856b7cc757.aspx", "editor": "shiji_huaiyin_hou/editor.html"}, {"id": "shiji_lianpo_linxiangru", "title": "七十列传·廉颇蔺相如列传第二十一", "source_url": "https://www.guwendao.net/guwen/bookv_fe564cb98c22.aspx", "editor": "shiji_lianpo_linxiangru/editor.html"}, {"id": "shiji_lisheng_lujia", "title": "七十列传·郦生陆贾列传第三十七", "source_url": "https://www.guwendao.net/guwen/bookv_2cd08cb40d37.aspx", "editor": "shiji_lisheng_lujia/editor.html"}, {"id": "shiji_qin_benji", "title": "十二本纪·秦本纪第五", "source_url": "https://www.guwendao.net/guwen/bookv_cab5e2fff7da.aspx", "editor": "shiji_qin_benji/editor.html"}, {"id": "shiji_shangjun", "title": "七十列传·商君列传第八", "source_url": "https://www.guwendao.net/guwen/bookv_294ca85f5800.aspx", "editor": "shiji_shangjun/editor.html"}, {"id": "shiji_zhao_shijia", "title": "三十世家·赵世家第十三", "source_url": "https://www.guwendao.net/guwen/bookv_b0999505466b.aspx", "editor": "shiji_zhao_shijia/editor.html"}],KEY='shiji',CUSTOM_KEY=KEY+'-custom-selection',chosen=new Set(JSON.parse(localStorage.getItem(KEY+'-selected')||'[]')),custom=JSON.parse(localStorage.getItem(CUSTOM_KEY)||'[]'),catalog=document.getElementById('catalog'),search=document.getElementById('search'),summary=document.getElementById('summary');function all(){return [...DATA,...custom]}function visible(){const q=search.value.trim().toLocaleLowerCase();return all().filter(x=>!q||x.title.toLocaleLowerCase().includes(q)||x.source_url.toLocaleLowerCase().includes(q))}function save(){localStorage.setItem(KEY+'-selected',JSON.stringify([...chosen]));localStorage.setItem(CUSTOM_KEY,JSON.stringify(custom));summary.textContent=`已选 ${chosen.size} 篇目 · 已有 ${DATA.length} 篇目 · 待处理 ${custom.length} 篇目`}function render(){const rows=visible();document.getElementById('visibleCount').textContent=`${rows.length} 篇目`;catalog.innerHTML='';rows.forEach((x,index)=>{const row=document.createElement('div');row.className='entry';row.innerHTML=`<span class="meta">${String(index+1).padStart(2,'0')}</span><label><input type="checkbox" data-id="${x.id}" ${chosen.has(x.id)?'checked':''}><span>${x.title} <small class="status ${x.editor?'done':''}">${x.editor?'已生成编辑器':'待处理'}</small></span></label><span class="links">${x.source_url?`<a href="${x.source_url}" target="_blank" rel="noreferrer">阅读原文</a>`:''}${x.editor?`<a href="${x.editor}?view=annotated" target="_blank">打开编辑器</a>`:''}</span>`;catalog.append(row)});save()}catalog.onchange=e=>{if(!e.target.dataset.id)return;e.target.checked?chosen.add(e.target.dataset.id):chosen.delete(e.target.dataset.id);save()};search.oninput=render;document.getElementById('selectVisible').onclick=()=>{const ids=visible().map(x=>x.id),selected=ids.length&&ids.every(x=>chosen.has(x));ids.forEach(x=>selected?chosen.delete(x):chosen.add(x));render()};document.getElementById('add').onclick=()=>{const title=document.getElementById('newTitle').value.trim(),source_url=document.getElementById('newUrl').value.trim();if(!title||!/^https?:\/\//i.test(source_url))return alert('请填写标题和有效的原文网址。');const id='custom-'+Date.now();custom.push({id,title,source_url,editor:''});chosen.add(id);document.getElementById('newTitle').value='';document.getElementById('newUrl').value='';search.value='';render()};document.getElementById('export').onclick=()=>{const entries=all().filter(x=>chosen.has(x.id));if(!entries.length)return alert('请先选择篇目。');const payload={version:1,collection:KEY,createdAt:new Date().toISOString(),entries},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download=KEY+'_processing_queue.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();
</script></body></html>
