<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Writings Studio</title><link rel="stylesheet" href="personal.css"></head><body>
<header class="topbar"><strong class="brand">Personal Writings Studio</strong><a href="../index.html#personal_writings">Reader catalog</a><span class="status" id="status">New private draft</span></header><div class="privacy"><strong>Private by default:</strong> entries stay in this browser until you explicitly export a backup or PDF.</div>
<nav class="toolbar"><button id="newBtn">New writing</button><button id="saveBtn">Save</button><button data-command="undo">Undo</button><button data-command="redo">Redo</button><button data-command="bold"><b>B</b></button><button data-command="underline"><u>U</u></button><button class="color" data-command="hiliteColor" data-value="#fff1a8"><i style="background:#fff1a8"></i></button><button class="color" data-command="hiliteColor" data-value="#dff0d2"><i style="background:#dff0d2"></i></button><button class="color" data-command="hiliteColor" data-value="#dcebf7"><i style="background:#dcebf7"></i></button><button id="clearFormat">Clear format</button><button id="exportBtn">Export backup</button><label class="button" for="importInput">Import backup</label><input class="hidden" id="importInput" type="file" accept="application/json,.json"><button class="primary" id="pdfBtn">Generate PDF</button></nav>
<main class="workspace" id="workspace"><section class="pane author-pane"><div class="metadata"><label>Writing type<select id="writingType"><option>Diary</option><option>Schedule</option><option>Journal</option><option>Reflection</option><option>Reading Notes</option><option>Meeting Notes</option></select></label><label>Date<input id="writingDate" type="date"></label><label class="wide">Title<input id="writingTitle" placeholder="Title"></label></div><div class="detail-fields" id="detailFields"></div><article class="editor-card"><h2 id="editorLabel">Entry</h2><div class="editor" id="editor" contenteditable="true" spellcheck="true"></div></article><section class="schedule-editor hidden" id="scheduleEditor"><header><h2>Schedule items</h2><button id="addSchedule">Add item</button></header><div id="scheduleRows"></div></section><section class="notes-card"><h2>Private notes</h2><textarea id="notes" placeholder="Follow-up thoughts, reminders, or production notes…"></textarea></section></section><div class="splitter" id="splitter" role="separator" aria-label="Resize writing and preview panes"></div><section class="pane preview-pane"><article class="page"><header><div class="type" id="previewType"></div><h1 id="previewTitle"></h1><div class="meta" id="previewMeta"></div><div class="preview-details" id="previewDetails"></div></header><div class="preview-body" id="previewBody"></div><table class="preview-schedule hidden" id="previewSchedule"><thead><tr><th>Time</th><th>Item</th><th>Priority</th><th>Status</th></tr></thead><tbody></tbody></table><aside class="preview-note private-note" id="previewNote" hidden></aside></article></section></main><script src="personal.js"></script></body></html>
